<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anahata — Gestión de Estudio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C4856A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anahata">
<link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:#FAF6F1;color:#3D2B1F;min-height:100vh}
:root{--pri:#C4856A;--sec:#8FAF8F;--dark:#3D2B1F;--muted:#9B8B7E;--acc:#E8D5C4;--white:#FFFFFF;--yoga:#FBF5EE;--yogab:#E8D5C4;--pole:#EEF5F5;--poleb:#C5DDD9;--danger:#C45A5A;--dangerBg:#FFF0F0}
input,select,button,textarea{font-family:'Lato',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#F0E8E0}::-webkit-scrollbar-thumb{background:var(--pri);border-radius:4px}
.inp{border:1.5px solid var(--acc);border-radius:8px;padding:10px 14px;font-size:13px;outline:none;width:100%;background:#FFFDF9;color:var(--dark);transition:border-color .2s}
.inp:focus{border-color:var(--pri)}
.card{background:var(--white);border-radius:14px;box-shadow:0 2px 18px rgba(61,43,31,.07)}
.tag{display:inline-flex;align-items:center;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 9px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade{animation:fadeUp .25s ease forwards}
.overlay{position:fixed;inset:0;background:rgba(61,43,31,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(3px)}
#app{display:flex;flex-direction:column;min-height:100vh}
header{background:var(--dark);padding:0 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;flex-shrink:0;flex-wrap:wrap}
.logo-area{padding:14px 0}
.logo-name{font-family:'Playfair Display',serif;font-size:18px;color:var(--pri);letter-spacing:4px}
.logo-sub{font-size:9px;letter-spacing:3px;color:var(--sec);text-transform:uppercase;margin-top:2px}
nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap}
.nav-btn{cursor:pointer;border:none;padding:9px 15px;font-size:11px;letter-spacing:.5px;background:transparent;color:#9B8B7E;border-radius:7px;transition:all .18s;font-family:'Lato',sans-serif;font-weight:700}
.nav-btn.active{background:var(--pri);color:#fff}
.nav-btn:hover:not(.active){color:#fff;background:rgba(196,133,106,.25)}
main{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%}
h1.pg{font-family:'Playfair Display',serif;font-size:26px;color:var(--dark);margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat-card{padding:22px 20px}
.stat-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.stat-val{font-family:'Playfair Display',serif;font-size:34px;font-weight:700}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px}
.pkg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pkg-card{padding:24px 20px;border-left:4px solid var(--pri)}
.pkg-title{font-family:'Playfair Display',serif;font-size:18px}
.pkg-price{font-size:34px;font-weight:700;margin:6px 0 4px}
.pkg-sub{font-size:12px;color:var(--muted)}
.pkg-rate{font-size:11px;color:var(--sec);margin-top:6px}
.stu-list{display:flex;flex-direction:column;gap:10px}
.stu-card{padding:18px 20px;display:flex;align-items:center;gap:16px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex-shrink:0;background:linear-gradient(135deg,var(--pri),var(--sec))}
.stu-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
/* Calendar */
.cal-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.week-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.week-lbl{font-size:13px;color:var(--muted);min-width:220px;text-align:center}
.cal-table{width:100%;border-collapse:separate;border-spacing:3px 3px;font-size:12px}
.cal-th{padding:9px 6px;text-align:center;font-weight:700;font-size:11px;color:var(--dark)}
.cal-th.today{color:var(--pri);border-bottom:2px solid var(--pri)}
.time-cell{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;padding:3px 8px;vertical-align:middle}
.class-cell{border-radius:8px;padding:5px 6px;cursor:pointer;transition:transform .15s;min-height:52px;border:1px solid transparent;position:relative}
.class-cell:hover{transform:scale(1.03)}
.class-cell.yoga{background:var(--yoga);border-color:var(--yogab)}
.class-cell.pole{background:var(--pole);border-color:var(--poleb)}
.class-type{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.class-cell.yoga .class-type{color:var(--pri)}
.class-cell.pole .class-type{color:var(--sec)}
.att-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.att-dot{width:16px;height:16px;border-radius:50%;background:var(--pri);color:#fff;font-size:7px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.att-dot.confirmed{background:var(--sec)}
.att-dot.appt{background:var(--acc);color:var(--dark);border:1px solid var(--pri)}
.cupo-badge{position:absolute;top:4px;right:5px;font-size:8px;color:var(--muted);font-weight:700}
.empty-cell{background:#F5F0EB;border-radius:8px;opacity:.3}
.break-row td{padding:6px 0;text-align:center;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
/* Receipts */
.receipt-row{display:grid;grid-template-columns:110px 1fr 120px 80px 80px 120px 100px;gap:0;align-items:center;padding:12px 16px;border-top:1px solid #F0E8E0;font-size:12px}
.receipt-hdr{background:#F5F0EB;padding:9px 16px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:grid;grid-template-columns:110px 1fr 120px 80px 80px 120px 100px}
.folio-badge{display:inline-block;background:#FBF0E8;border-radius:6px;padding:3px 8px;font-size:10px;letter-spacing:1px;color:var(--pri);font-weight:700;font-family:monospace}
/* Modal */
.modal-box{background:var(--white);border-radius:16px;width:100%;max-width:500px;padding:24px;animation:fadeUp .22s ease;max-height:92vh;overflow-y:auto}
.modal-title{font-family:'Playfair Display',serif;font-size:19px;color:var(--dark);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.form-group{margin-bottom:12px}
.form-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.pkg-option{width:100%;background:#FFFDF9;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .18s;margin-bottom:9px;border:2px solid var(--acc)}
.pkg-option:hover{transform:translateY(-1px)}
.pkg-option-name{font-weight:700;font-size:14px}
.pkg-option-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pkg-option-price{font-size:24px;font-weight:700}
.empty-state{padding:50px;text-align:center}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-txt{font-family:'Playfair Display',serif;font-size:18px;color:var(--muted)}
.empty-sub{font-size:13px;color:var(--muted);margin-top:6px}
.recent-hdr{display:grid;grid-template-columns:1fr 1fr 1fr auto;padding:8px 18px;background:#F5F0EB;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.recent-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;padding:12px 18px;border-top:1px solid #F0E8E0;align-items:center;font-size:13px}
.leg{display:flex;gap:14px;margin-top:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-box{width:14px;height:14px;border-radius:3px;flex-shrink:0}
#status-bar{padding:4px 10px;font-size:10px;font-weight:700;border-radius:20px;transition:all .3s}
#status-bar.online{color:var(--sec)}
#status-bar.offline{color:#C45A5A;animation:pulse 2s infinite}
#status-bar.saving{color:var(--muted)}
#install-btn{display:none;cursor:pointer;border:1.5px solid var(--pri);background:transparent;color:var(--pri);padding:7px 14px;border-radius:7px;font-size:10px;font-weight:700;font-family:'Lato',sans-serif}
#install-btn.show{display:block}
.loading-screen{position:fixed;inset:0;background:#FAF6F1;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.spinner{width:32px;height:32px;border:3px solid var(--acc);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
.loading-lbl{font-family:'Playfair Display',serif;font-size:18px;color:var(--pri)}
.loading-sub{font-size:12px;color:var(--muted);margin-top:6px}
/* Pkg rows in student detail */
.pkg-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:8px;border:1.5px solid var(--acc);background:#FFFDF9}
.pkg-row-info{flex:1}
.pkg-row-name{font-weight:700;font-size:13px}
.pkg-row-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pkg-bar-wrap{background:#F0EBE5;border-radius:10px;height:5px;margin-top:6px;overflow:hidden}
.pkg-bar{height:5px;border-radius:10px;background:var(--sec);transition:width .4s}
.danger-zone{margin-top:18px;padding-top:14px;border-top:1px dashed #FFAAAA}
.danger-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--danger);margin-bottom:10px}
/* Appointment rows inside slot modal */
.appt-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:7px;border:1.5px solid var(--acc);background:#FFFDF9;transition:all .18s}
.appt-row.confirmed{background:#F0F7F0;border-color:var(--sec)}
.appt-row-name{flex:1;font-weight:700;font-size:13px}
.appt-row-sub{font-size:11px;color:var(--muted);margin-top:1px}
/* Payment method selector */
.pay-option{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:10px;border:2px solid var(--acc);cursor:pointer;transition:all .18s;margin-bottom:8px;background:#FFFDF9}
.pay-option:hover{border-color:var(--pri)}
.pay-option.selected{border-color:var(--pri);background:#FBF0E8}
.pay-option-icon{font-size:22px}
.pay-option-name{font-weight:700;font-size:14px}
.pay-option-sub{font-size:11px;color:var(--muted);margin-top:1px}
/* Reports page */
.report-screen{position:fixed;inset:0;background:#FAF6F1;z-index:300;overflow-y:auto;padding:24px}
.report-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.report-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--dark)}
.report-section{margin-bottom:28px}
.report-section-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--acc)}
.report-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.report-kpi{background:var(--white);border-radius:12px;padding:18px;box-shadow:0 2px 12px rgba(61,43,31,.06)}
.report-kpi-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.report-kpi-val{font-family:'Playfair Display',serif;font-size:28px;font-weight:700}
.report-table{width:100%;border-collapse:collapse;font-size:12px}
.report-table th{background:#F5F0EB;padding:9px 14px;text-align:left;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.report-table td{padding:10px 14px;border-bottom:1px solid #F0E8E0;color:var(--dark)}
.report-table tr:last-child td{border-bottom:none}
.report-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.report-bar-label{font-size:12px;width:100px;flex-shrink:0}
.report-bar-track{flex:1;background:#F0EBE5;border-radius:6px;height:10px;overflow:hidden}
.report-bar-fill{height:10px;border-radius:6px;background:var(--pri)}
.report-bar-val{font-size:12px;font-weight:700;width:60px;text-align:right;flex-shrink:0}
.pay-tag-ef{background:#F0F7F0;color:#4A7A4A;border:1px solid #8FAF8F}
.pay-tag-tr{background:#EEF5FF;color:#2E6BB5;border:1px solid #90B8E8}
@media print{.report-header .back-btn{display:none}.report-screen{padding:16px}}
@media(max-width:700px){.stats-grid{grid-template-columns:1fr 1fr}.pkg-grid{grid-template-columns:1fr}.receipt-row,.receipt-hdr{grid-template-columns:80px 1fr auto}.week-lbl{min-width:150px;font-size:11px}.report-kpi-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="spinner"></div>
  <div class="loading-lbl">ANAHATA</div>
  <div class="loading-sub" id="loading-msg">Conectando con Firebase...</div>
</div>
<div id="app" style="display:none;flex-direction:column;min-height:100vh"></div>
<div id="report-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
// ── Firebase ───────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:            "AIzaSyDh5Tf348VS71KfQOocRSnYq1q9Q5YqYpo",
  authDomain:        "hanahata-79d88.firebaseapp.com",
  projectId:         "hanahata-79d88",
  storageBucket:     "hanahata-79d88.firebasestorage.app",
  messagingSenderId: "730963561138",
  appId:             "1:730963561138:web:708eca70e88611e790d7ab"
});
const db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

// ── Constantes ─────────────────────────────────────────────────────
const PKG={
  '12':{label:'12 Clases',   price:800,classes:12,color:'#8FAF8F'},
  '8': {label:'8 Clases',    price:600,classes:8, color:'#C4856A'},
  '1': {label:'Clase Suelta',price:100,classes:1, color:'#B8A9C9'}
};
const SLOTS=[
  {id:'s1',time:'7:00–8:00'},{id:'s2',time:'8:10–9:10'},
  {id:'s3',time:'9:20–10:20'},{id:'s4',time:'10:30–11:30'},
  {id:'s5',time:'17:00–18:00'},{id:'s6',time:'18:10–19:10'},
  {id:'s7',time:'19:20–20:20'},{id:'s8',time:'20:30–21:30'}
];
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb'];
const MAX_CUPO=10;
const CM={
  Lun: {s1:'yoga',s2:'yoga',s3:'pole',s4:'pole',s5:'yoga',s6:'yoga',s7:'pole',s8:'pole'},
  Mar: {s1:'yoga',s2:'yoga',s3:'pole',s4:'pole',s5:'pole',s6:'pole',s7:'yoga',s8:'yoga'},
  'Mié':{s1:'yoga',s2:'yoga',s3:'pole',s4:'pole',s5:'yoga',s6:'yoga',s7:'pole',s8:'pole'},
  Jue: {s1:'yoga',s2:'yoga',s3:'pole',s4:'pole',s5:'pole',s6:'pole',s7:'yoga',s8:'yoga'},
  Vie: {s1:'yoga',s2:'yoga',s3:'pole',s4:'pole',s5:'yoga',s6:'yoga',s7:'pole',s8:'pole'},
  'Sáb':{s1:'yoga',s2:'yoga',s3:'pole',s4:'pole'}
};

const uid=()=>Math.random().toString(36).slice(2,9);
const fmtDate=d=>new Date(d).toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtLong=d=>new Date(d).toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
const getMonday=d=>{const r=new Date(d),w=r.getDay();r.setDate(r.getDate()-(w===0?6:w-1));r.setHours(0,0,0,0);return r};
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const dKey=d=>d.toISOString().slice(0,10);
const monthName=d=>new Date(d).toLocaleDateString('es-MX',{month:'long',year:'numeric'});

// ── State ──────────────────────────────────────────────────────────
// appointments: { "dateKey_slotId": [{id, studentId, studentName, confirmed}] }
// attendance:   { "dateKey_slotId": [studentId,...] }  (confirmed attended)
let S={
  tab:'dashboard',
  students:[],
  attendance:{},
  appointments:{},
  receipts:[],
  weekStart:getMonday(new Date()),
  modal:null,
  report:null  // null | {type:'week'|'month', date: ISOstring}
};
let saveT=null,remoteUpd=false;

// ── Firestore ──────────────────────────────────────────────────────
db.collection('estudio').doc('principal').onSnapshot(snap=>{
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  if(snap.exists){
    remoteUpd=true;
    const d=snap.data();
    S.students=d.students||[];
    S.attendance=d.attendance||{};
    S.appointments=d.appointments||{};
    S.receipts=d.receipts||[];
    remoteUpd=false;
  }
  render();setStatus(navigator.onLine?'online':'offline');
},()=>{
  document.getElementById('loading-msg').textContent='Error de conexión, reintentando...';
  setTimeout(()=>location.reload(),4000);
});

function save(){
  if(remoteUpd)return;
  if(saveT)clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    setStatus('saving');
    try{
      await db.collection('estudio').doc('principal').set({
        students:S.students,attendance:S.attendance,
        appointments:S.appointments,receipts:S.receipts,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      setStatus(navigator.onLine?'online':'offline');
    }catch(e){setStatus('offline');}
  },800);
}
function setStatus(t){
  const b=document.getElementById('status-bar');if(!b)return;
  b.className=t;b.id='status-bar';
  b.textContent=t==='online'?'● En línea':t==='offline'?'● Sin conexión':'↑ Guardando...';
}
window.addEventListener('online',()=>setStatus('online'));
window.addEventListener('offline',()=>setStatus('offline'));
let dp=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;const b=document.getElementById('install-btn');if(b)b.classList.add('show');});
function installApp(){if(!dp)return;dp.prompt();dp.userChoice.then(()=>{dp=null;const b=document.getElementById('install-btn');if(b)b.classList.remove('show');});}

function setState(p,sv=true){S={...S,...p};if(sv)save();render();}

// ── Business logic ─────────────────────────────────────────────────
function addStudent(name,phone,email){
  setState({students:[...S.students,{id:uid(),name,phone,email,packages:[],createdAt:new Date().toISOString()}],modal:null});
}
function deleteStudent(sid){
  if(!confirm('¿Eliminar esta estudiante y todos sus datos?'))return;
  setState({students:S.students.filter(s=>s.id!==sid),modal:null});
}
function addPackage(sid,pt,payMethod){
  const pkg=PKG[pt],stu=S.students.find(s=>s.id===sid);
  const np={id:uid(),type:pt,label:pkg.label,total:pkg.classes,remaining:pkg.classes,price:pkg.price,purchasedAt:new Date().toISOString()};
  const r={id:uid(),folio:`ANA-${Date.now().toString().slice(-6)}`,studentId:sid,studentName:stu.name,phone:stu.phone,pkgLabel:pkg.label,classes:pkg.classes,amount:pkg.price,payMethod:payMethod||'efectivo',date:new Date().toISOString()};
  setState({students:S.students.map(s=>s.id!==sid?s:{...s,packages:[...s.packages,np]}),receipts:[r,...S.receipts],modal:null});
  if(confirm(`Recibo ${r.folio} generado.\n¿Imprimir/PDF ahora?`))printReceipt(r);
}
function deletePackage(sid,pkgId){
  if(!confirm('¿Eliminar este paquete?'))return;
  setState({students:S.students.map(s=>s.id!==sid?s:{...s,packages:s.packages.filter(p=>p.id!==pkgId)}),modal:null});
}

// Appointments
function addAppointment(dk,slotId,sid){
  const key=`${dk}_${slotId}`;
  const cur=S.appointments[key]||[];
  if(cur.find(a=>a.studentId===sid))return; // ya agendada
  const stu=S.students.find(s=>s.id===sid);
  const newAppt={id:uid(),studentId:sid,studentName:stu.name,confirmed:false};
  setState({appointments:{...S.appointments,[key]:[...cur,newAppt]}});
}
function removeAppointment(dk,slotId,apptId){
  const key=`${dk}_${slotId}`;
  const cur=S.appointments[key]||[];
  setState({appointments:{...S.appointments,[key]:cur.filter(a=>a.id!==apptId)}});
}
function toggleConfirmAppt(dk,slotId,apptId){
  const key=`${dk}_${slotId}`;
  const cur=S.appointments[key]||[];
  // Toggle confirmed and also update attendance
  const updated=cur.map(a=>{
    if(a.id!==apptId)return a;
    return {...a,confirmed:!a.confirmed};
  });
  const confirmedAppt=updated.find(a=>a.id===apptId);
  // Sync attendance
  const attCur=S.attendance[key]||[];
  let newAtt=attCur;
  if(confirmedAppt.confirmed){
    // Add to attendance if not there, deduct class
    if(!attCur.includes(confirmedAppt.studentId)){
      const stu=S.students.find(s=>s.id===confirmedAppt.studentId);
      const pkg=stu?.packages.find(p=>p.remaining>0);
      if(!pkg){alert(`${confirmedAppt.studentName} no tiene clases disponibles.\nAgrégale un paquete.`);return;}
      const newStudents=S.students.map(s=>s.id!==confirmedAppt.studentId?s:{...s,packages:s.packages.map(p=>p.id!==pkg.id?p:{...p,remaining:p.remaining-1})});
      newAtt=[...attCur,confirmedAppt.studentId];
      setState({appointments:{...S.appointments,[key]:updated},attendance:{...S.attendance,[key]:newAtt},students:newStudents});
      return;
    }
  } else {
    // Remove from attendance, restore class
    if(attCur.includes(confirmedAppt.studentId)){
      const stu=S.students.find(s=>s.id===confirmedAppt.studentId);
      const pkgR=[...stu.packages].reverse().find(p=>p.remaining<p.total);
      let newStudents=S.students;
      if(pkgR)newStudents=S.students.map(s=>s.id!==confirmedAppt.studentId?s:{...s,packages:s.packages.map(p=>p.id!==pkgR.id?p:{...p,remaining:Math.min(p.remaining+1,p.total)})});
      newAtt=attCur.filter(id=>id!==confirmedAppt.studentId);
      setState({appointments:{...S.appointments,[key]:updated},attendance:{...S.attendance,[key]:newAtt},students:newStudents});
      return;
    }
  }
  setState({appointments:{...S.appointments,[key]:updated}});
}

// ── DOM helpers ────────────────────────────────────────────────────
function el(tag,attrs={},ch=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')e.className=v;
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else e.setAttribute(k,v);
  }
  for(const c of ch)if(c!=null)typeof c==='string'?e.appendChild(document.createTextNode(c)):e.appendChild(c);
  return e;
}
const div=(cls,ch=[],a={})=>el('div',{class:cls,...a},ch);
function mkBtn(label,onClick,s={}){
  const b=el('button',{onClick},[label]);
  Object.assign(b.style,{cursor:'pointer',border:'none',borderRadius:'8px',fontWeight:'700',fontFamily:"'Lato',sans-serif",...s});
  return b;
}
function mkDangerBtn(label,onClick){
  return mkBtn(label,onClick,{background:'var(--dangerBg)',color:'var(--danger)',padding:'7px 12px',fontSize:'11px',border:'1px solid #FFAAAA'});
}

  const{type,date}=S.report;
  const now=new Date(date);

  // Get date range
  let rangeStart,rangeEnd,rangeLabel;
  if(type==='week'){
    rangeStart=getMonday(now);
    rangeEnd=addDays(rangeStart,6);
    const ds=rangeStart.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
    const de=rangeEnd.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
    rangeLabel=`Semana del ${ds} al ${de}`;
  } else {
    rangeStart=new Date(now.getFullYear(),now.getMonth(),1);
    rangeEnd=new Date(now.getFullYear(),now.getMonth()+1,0);
    rangeLabel=monthName(now).charAt(0).toUpperCase()+monthName(now).slice(1);
  }

  const startKey=dKey(rangeStart),endKey=dKey(rangeEnd);

  // Filter receipts in range
  const receipts=S.receipts.filter(r=>{
    const k=dKey(new Date(r.date));
    return k>=startKey&&k<=endKey;
  });

  const totalVentas=receipts.reduce((s,r)=>s+r.amount,0);
  const efectivo=receipts.filter(r=>!r.payMethod||r.payMethod==='efectivo').reduce((s,r)=>s+r.amount,0);
  const transferencia=receipts.filter(r=>r.payMethod==='transferencia').reduce((s,r)=>s+r.amount,0);

  // Attendance in range
  const attInRange=Object.entries(S.attendance).filter(([k])=>{
    const dk2=k.split('_')[0];
    return dk2>=startKey&&dk2<=endKey;
  });
  const totalAtt=attInRange.reduce((s,[,v])=>s+v.length,0);

  // PKG breakdown
  const pkgCount={'12':0,'8':0,'1':0};
  receipts.forEach(r=>pkgCount[r.pkgType]=(pkgCount[r.pkgType]||0)+1);

  // Top students by attendance
  const stuAtt={};
  attInRange.forEach(([,ids])=>ids.forEach(id=>stuAtt[id]=(stuAtt[id]||0)+1));
  const topStu=Object.entries(stuAtt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,cnt])=>{
    const s=S.students.find(st=>st.id===id);
    return{name:s?.name||'—',count:cnt};
  });

  // Daily sales (for week) or weekly totals (for month)
  let chartData=[];
  if(type==='week'){
    for(let i=0;i<7;i++){
      const d=addDays(rangeStart,i);
      const k=dKey(d);
      const daySales=receipts.filter(r=>dKey(new Date(r.date))===k).reduce((s,r)=>s+r.amount,0);
      const dayLabel=d.toLocaleDateString('es-MX',{weekday:'short'});
      chartData.push({label:dayLabel,val:daySales});
    }
  } else {
    // Weekly buckets
    let cur=new Date(rangeStart);let wk=1;
    while(cur<=rangeEnd){
      const wEnd=addDays(cur,6);
      const wSales=receipts.filter(r=>{const k=dKey(new Date(r.date));return k>=dKey(cur)&&k<=dKey(wEnd);}).reduce((s,r)=>s+r.amount,0);
      chartData.push({label:`Sem ${wk}`,val:wSales});
      cur=addDays(cur,7);wk++;
    }
  }
  const maxChart=Math.max(...chartData.map(d=>d.val),1);

  // Build screen
  const screen=div('report-screen');

  // Header
  const hdr=div('report-header');
  const backBtn=mkBtn('← Volver al Panel',()=>setState({report:null},false),{background:'var(--dark)',color:'#fff',padding:'10px 18px',fontSize:'12px',borderRadius:'9px',class:'back-btn'});
  const printBtn=mkBtn('🖨 Imprimir',()=>window.print(),{background:'var(--acc)',color:'var(--dark)',padding:'10px 18px',fontSize:'12px',borderRadius:'9px'});
  const titleEl=el('div');
  titleEl.appendChild(el('div',{class:'report-title'},[type==='week'?'Reporte Semanal':'Reporte Mensual']));
  titleEl.appendChild(el('div',{style:{fontSize:'13px',color:'var(--muted)',marginTop:'4px'}},[rangeLabel]));
  hdr.appendChild(backBtn);hdr.appendChild(titleEl);hdr.appendChild(printBtn);
  screen.appendChild(hdr);

  // KPIs
  const kpiSection=div('report-section');
  kpiSection.appendChild(el('div',{class:'report-section-title'},['Resumen']));
  const kpiGrid=div('report-kpi-grid');
  [{lbl:'Ventas totales',val:`$${totalVentas.toLocaleString()}`,c:'#C4856A'},{lbl:'Asistencias',val:totalAtt,c:'#8FAF8F'},{lbl:'Paquetes vendidos',val:receipts.length,c:'#B8A9C9'},{lbl:'Promedio por venta',val:receipts.length?`$${Math.round(totalVentas/receipts.length).toLocaleString()}`:'—',c:'#D4A96A'}].forEach(k=>{
    const c=div('report-kpi');
    c.appendChild(el('div',{class:'report-kpi-label'},[k.lbl]));
    c.appendChild(el('div',{class:'report-kpi-val',style:{color:k.c}},[String(k.val)]));
    kpiGrid.appendChild(c);
  });
  kpiSection.appendChild(kpiGrid);
  screen.appendChild(kpiSection);

  // Métodos de pago
  const paySection=div('report-section');
  paySection.appendChild(el('div',{class:'report-section-title'},['Métodos de pago']));
  const payGrid=div('',[], {style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}});
  [{lbl:'Efectivo',val:efectivo,pct:totalVentas?Math.round(efectivo/totalVentas*100):0,color:'#8FAF8F'},
   {lbl:'Transferencia',val:transferencia,pct:totalVentas?Math.round(transferencia/totalVentas*100):0,color:'#5E8FD4'}
  ].forEach(m=>{
    const c=div('report-kpi');
    c.appendChild(el('div',{class:'report-kpi-label'},[m.lbl]));
    c.appendChild(el('div',{class:'report-kpi-val',style:{color:m.color}},[`$${m.val.toLocaleString()}`]));
    c.appendChild(el('div',{style:{fontSize:'11px',color:'var(--muted)',marginTop:'4px'}},[`${m.pct}% del total`]));
    payGrid.appendChild(c);
  });
  paySection.appendChild(payGrid);
  screen.appendChild(paySection);

  // Gráfica de barras
  const chartSection=div('report-section');
  chartSection.appendChild(el('div',{class:'report-section-title'},[type==='week'?'Ventas por día':'Ventas por semana']));
  const chartCard=div('card',[],{style:{padding:'20px'}});
  chartData.forEach(d=>{
    const pct=Math.round((d.val/maxChart)*100);
    const row=div('report-bar-row');
    const lbl=el('div',{class:'report-bar-label'},[d.label]);
    const track=div('report-bar-track');
    const fill=div('report-bar-fill');fill.style.width=`${pct}%`;
    track.appendChild(fill);
    const valEl=el('div',{class:'report-bar-val'},[d.val?`$${d.val.toLocaleString()}`:'—']);
    row.appendChild(lbl);row.appendChild(track);row.appendChild(valEl);
    chartCard.appendChild(row);
  });
  chartSection.appendChild(chartCard);
  screen.appendChild(chartSection);

  // Paquetes vendidos
  const pkgSection=div('report-section');
  pkgSection.appendChild(el('div',{class:'report-section-title'},['Paquetes vendidos']));
  const pkgTable=el('table',{class:'report-table'});
  const pkgHead=el('tr');['Paquete','Cantidad','Total'].forEach(t=>pkgHead.appendChild(el('th',[],[t])));pkgTable.appendChild(pkgHead);
  Object.entries(PKG).forEach(([k,p])=>{
    const cnt=pkgCount[k]||0;
    const row=el('tr');
    row.appendChild(el('td',[],[p.label]));
    row.appendChild(el('td',[],[String(cnt)]));
    row.appendChild(el('td',{style:{fontWeight:'700'}},[`$${(cnt*p.price).toLocaleString()}`]));
    pkgTable.appendChild(row);
  });
  pkgSection.appendChild(pkgTable);
  screen.appendChild(pkgSection);

  // Detalle de ventas
  const detSection=div('report-section');
  detSection.appendChild(el('div',{class:'report-section-title'},['Detalle de ventas']));
  if(!receipts.length){
    detSection.appendChild(el('div',{style:{color:'var(--muted)',fontSize:'13px',padding:'20px 0'}},['Sin ventas en este período']));
  } else {
    const detTable=el('table',{class:'report-table'});
    const dh=el('tr');['Folio','Estudiante','Paquete','Pago','Monto'].forEach(t=>dh.appendChild(el('th',[],[t])));detTable.appendChild(dh);
    receipts.forEach(r=>{
      const row=el('tr');
      row.appendChild(el('td',{style:{fontFamily:'monospace',fontSize:'11px'}},[r.folio]));
      row.appendChild(el('td',[],[r.studentName]));
      row.appendChild(el('td',[],[r.pkgLabel]));
      row.appendChild(el('td',[],[r.payMethod==='transferencia'?'Transfer.':'Efectivo']));
      row.appendChild(el('td',{style:{fontWeight:'700',color:'var(--pri)'}},[`$${r.amount}`]));
      detTable.appendChild(row);
    });
    detSection.appendChild(detTable);
  }
  screen.appendChild(detSection);

  // Top asistencias
  if(topStu.length){
    const topSection=div('report-section');
    topSection.appendChild(el('div',{class:'report-section-title'},['Top asistencias']));
    const topCard=div('card',[],{style:{padding:'16px 20px'}});
    const maxA=topStu[0].count;
    topStu.forEach(s=>{
      const pct=Math.round((s.count/maxA)*100);
      const row=div('report-bar-row');
      const lbl=el('div',{class:'report-bar-label',style:{width:'130px'}},[s.name]);
      const track=div('report-bar-track');
      const fill=div('report-bar-fill');fill.style.background='var(--sec)';fill.style.width=`${pct}%`;
      track.appendChild(fill);
      const valEl=el('div',{class:'report-bar-val'},[`${s.count} clase${s.count>1?'s':''}`]);
      row.appendChild(lbl);row.appendChild(track);row.appendChild(valEl);
      topCard.appendChild(row);
    });
    topSection.appendChild(topCard);
    screen.appendChild(topSection);
  }

  // Bottom back button
  screen.appendChild(mkBtn('← Volver al Panel',()=>setState({report:null},false),{background:'var(--dark)',color:'#fff',padding:'12px 24px',fontSize:'13px',borderRadius:'10px',marginTop:'10px'}));

  return screen;
}

// ── Modals ─────────────────────────────────────────────────────────
function renderModal(){
  const ov=div('overlay');
  ov.onclick=e=>{if(e.target===ov)setState({modal:null},false);};
  const xs={background:'none',border:'none',fontSize:'20px',cursor:'pointer',color:'var(--muted)',lineHeight:'1'};

  // ── Nueva estudiante ──
  if(S.modal==='newStudent'){
    const box=div('modal-box');
    box.appendChild(div('modal-title',[el('span',{style:{fontFamily:"'Playfair Display',serif"}},['Nueva Estudiante']),mkBtn('✕',()=>setState({modal:null},false),xs)]));
    let name='',phone='',email='';
    const ni=el('input',{class:'inp',placeholder:'Nombre completo',type:'text'});
    const pi=el('input',{class:'inp',placeholder:'(644) 000-0000',type:'tel'});
    const ei=el('input',{class:'inp',placeholder:'correo@ejemplo.com',type:'email'});
    ni.oninput=e=>name=e.target.value;pi.oninput=e=>phone=e.target.value;ei.oninput=e=>email=e.target.value;
    [['NOMBRE *',ni],['TELÉFONO',pi],['EMAIL',ei]].forEach(([l,inp])=>{
      const g=div('form-group');g.appendChild(el('label',{class:'form-label'},[l]));g.appendChild(inp);box.appendChild(g);
    });
    const br=el('div',{style:{display:'flex',gap:'10px',marginTop:'14px'}});
    br.appendChild(mkBtn('Cancelar',()=>setState({modal:null},false),{flex:'1',background:'var(--acc)',color:'var(--dark)',padding:'12px 0',fontSize:'12px'}));
    br.appendChild(mkBtn('Guardar',()=>{if(!name.trim()){ni.style.borderColor='#AA4444';ni.focus();return;}addStudent(name.trim(),phone.trim(),email.trim());},{flex:'2',background:'var(--pri)',color:'#fff',padding:'12px 0',fontSize:'12px'}));
    box.appendChild(br);ov.appendChild(box);
  }

  // ── Detalle estudiante ──
  else if(S.modal?.startsWith('stuDetail:')){
    const sid=S.modal.split(':')[1];
    const stu=S.students.find(s=>s.id===sid);
    if(!stu){setState({modal:null},false);return ov;}
    const box=div('modal-box');
    box.appendChild(div('modal-title',[el('span',{style:{fontFamily:"'Playfair Display',serif"}},[stu.name]),mkBtn('✕',()=>setState({modal:null},false),xs)]));
    box.appendChild(el('div',{style:{fontSize:'12px',color:'var(--muted)',marginBottom:'16px'}},[stu.phone?`📱 ${stu.phone}   `:' ',stu.email?`✉️ ${stu.email}`:'']));
    box.appendChild(el('div',{style:{fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',color:'var(--muted)',marginBottom:'8px'}},['Paquetes']));
    if(!stu.packages.length){
      box.appendChild(el('div',{style:{fontSize:'13px',color:'var(--muted)',marginBottom:'12px'}},['Sin paquetes asignados.']));
    } else {
      stu.packages.forEach(p=>{
        const pct=Math.round((p.remaining/p.total)*100);
        const row=div('pkg-row');
        const info=el('div',{class:'pkg-row-info'});
        info.appendChild(el('div',{class:'pkg-row-name'},[p.label]));
        info.appendChild(el('div',{class:'pkg-row-sub'},[`${p.remaining} de ${p.total} restantes · ${fmtDate(p.purchasedAt)}`]));
        const bw=div('pkg-bar-wrap');const bf=div('pkg-bar');bf.style.width=`${pct}%`;bf.style.background=p.remaining>0?'var(--sec)':'#DDD';bw.appendChild(bf);info.appendChild(bw);
        row.appendChild(info);row.appendChild(mkDangerBtn('🗑',()=>deletePackage(sid,p.id)));
        box.appendChild(row);
      });
    }
    box.appendChild(mkBtn('+ Agregar nuevo paquete',()=>setState({modal:`addPkg:${sid}`},false),{width:'100%',background:'var(--pri)',color:'#fff',padding:'12px 0',fontSize:'12px',marginTop:'6px'}));
    const dz=div('danger-zone');
    dz.appendChild(el('div',{class:'danger-title'},['⚠ Zona de riesgo']));
    dz.appendChild(mkDangerBtn('🗑 Eliminar estudiante permanentemente',()=>deleteStudent(sid)));
    box.appendChild(dz);ov.appendChild(box);
  }

  // ── Agregar paquete (con método de pago) ──
  else if(S.modal?.startsWith('addPkg:')){
    const sid=S.modal.split(':')[1],stu=S.students.find(s=>s.id===sid);
    // Check if we have pkg selected already
    const parts=S.modal.split(':');
    const selectedPkg=parts[2]||null;
    const selectedPay=parts[3]||null;

    const box=div('modal-box');
    box.appendChild(div('modal-title',[el('span',{style:{fontFamily:"'Playfair Display',serif"}},['Nuevo paquete']),mkBtn('✕',()=>setState({modal:null},false),xs)]));
    box.appendChild(el('div',{style:{fontSize:'12px',color:'var(--muted)',marginBottom:'16px'}},[`Para: ${stu?.name||''}`]));

    if(!selectedPkg){
      // Step 1: choose package
      box.appendChild(el('div',{style:{fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',color:'var(--muted)',marginBottom:'10px'}},['1. Elige el paquete']));
      Object.entries(PKG).forEach(([k,p])=>{
        const opt=div('pkg-option');opt.style.borderColor=p.color;
        opt.onclick=()=>setState({modal:`addPkg:${sid}:${k}`},false);
        const info=el('div');
        info.appendChild(el('div',{class:'pkg-option-name'},[p.label]));
        info.appendChild(el('div',{class:'pkg-option-sub'},[`${p.classes} ${p.classes===1?'clase':'clases'}${p.classes>1?` · $${(p.price/p.classes).toFixed(0)}/clase`:''}`]));
        opt.appendChild(info);opt.appendChild(el('div',{class:'pkg-option-price',style:{color:p.color}},[`$${p.price}`]));box.appendChild(opt);
      });
    } else {
      // Step 2: choose payment method
      const pkg=PKG[selectedPkg];
      // Show selected pkg summary
      const summary=div('',[], {style:{background:'#FBF0E8',borderRadius:'10px',padding:'12px 16px',marginBottom:'18px',display:'flex',justifyContent:'space-between',alignItems:'center'}});
      summary.appendChild(el('div',[],[el('div',{style:{fontWeight:'700'}},[pkg.label]),el('div',{style:{fontSize:'11px',color:'var(--muted)',marginTop:'2px'}},[`${pkg.classes} clases`])]));
      summary.appendChild(el('div',{style:{fontFamily:"'Playfair Display',serif",fontSize:'22px',fontWeight:'700',color:'var(--pri)'}},[`$${pkg.price}`]));
      box.appendChild(summary);
      box.appendChild(el('div',{style:{fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',color:'var(--muted)',marginBottom:'10px'}},['2. Método de pago']));
      [{id:'efectivo',icon:'💵',name:'Efectivo',sub:'Pago en mano'},{id:'transferencia',icon:'📲',name:'Transferencia',sub:'Pago por banco'}].forEach(pm=>{
        const opt=div(`pay-option${selectedPay===pm.id?' selected':''}`);
        opt.onclick=()=>setState({modal:`addPkg:${sid}:${selectedPkg}:${pm.id}`},false);
        opt.appendChild(el('div',{class:'pay-option-icon'},[pm.icon]));
        const inf=el('div');
        inf.appendChild(el('div',{class:'pay-option-name'},[pm.name]));
        inf.appendChild(el('div',{class:'pay-option-sub'},[pm.sub]));
        opt.appendChild(inf);
        if(selectedPay===pm.id) opt.appendChild(el('div',{style:{color:'var(--pri)',fontSize:'18px',fontWeight:'700'}},['✓']));
        box.appendChild(opt);
      });
      const btnRow=el('div',{style:{display:'flex',gap:'10px',marginTop:'16px'}});
      btnRow.appendChild(mkBtn('← Cambiar paquete',()=>setState({modal:`addPkg:${sid}`},false),{background:'var(--acc)',color:'var(--dark)',padding:'12px 0',flex:'1',fontSize:'12px'}));
      const confirmBtn=mkBtn('Confirmar y generar recibo',()=>{
        if(!selectedPay){alert('Selecciona un método de pago.');return;}
        addPackage(sid,selectedPkg,selectedPay);
      },{background:selectedPay?'var(--pri)':'var(--muted)',color:'#fff',padding:'12px 0',flex:'2',fontSize:'12px'});
      btnRow.appendChild(confirmBtn);
      box.appendChild(btnRow);
    }
    ov.appendChild(box);
  }

  // ── Slot (citas + asistencias) ──
  else if(S.modal?.startsWith('slot:')){
    const[,day,dk2,slotId]=S.modal.split(':'),slot=SLOTS.find(s=>s.id===slotId),ct=CM[day]?.[slotId];
    const ak=`${dk2}_${slotId}`;
    const appts=S.appointments[ak]||[];
    const dl=new Date(dk2+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    const box=div('modal-box');
    box.appendChild(div('modal-title',[
      el('span',{style:{fontFamily:"'Playfair Display',serif"}},[ct==='yoga'?'Yoga':'Pole Fitness']),
      mkBtn('✕',()=>setState({modal:null},false),xs)
    ]));
    box.appendChild(el('div',{style:{fontSize:'12px',color:'var(--muted)',marginBottom:'4px'}},[`${slot?.time} · ${dl}`]));
    const cupoLeft=MAX_CUPO-appts.length;
    box.appendChild(el('div',{style:{fontSize:'11px',color:cupoLeft<=0?'var(--danger)':'var(--muted)',marginBottom:'14px',fontWeight:'700'}},[`Cupo: ${appts.length}/${MAX_CUPO} · ${cupoLeft>0?`${cupoLeft} lugares disponibles`:'Clase llena'}`]));

    // Appointments section
    box.appendChild(el('div',{style:{fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',color:'var(--muted)',marginBottom:'8px'}},['Citas agendadas']));
    if(!appts.length){
      box.appendChild(el('div',{style:{fontSize:'13px',color:'var(--muted)',marginBottom:'12px',padding:'12px',background:'#F5F0EB',borderRadius:'8px',textAlign:'center'}},['Sin citas agendadas para esta clase']));
    } else {
      appts.forEach(a=>{
        const row=div(`appt-row${a.confirmed?' confirmed':''}`);
        const left=el('div');
        const av=el('div');Object.assign(av.style,{width:'32px',height:'32px',borderRadius:'50%',background:a.confirmed?'var(--sec)':'var(--acc)',display:'flex',alignItems:'center',justifyContent:'center',color:a.confirmed?'#fff':'var(--dark)',fontWeight:'700',fontSize:'13px',flexShrink:'0'});
        av.textContent=a.confirmed?'✓':a.studentName.charAt(0).toUpperCase();
        left.appendChild(av);
        left.style.display='flex';left.style.alignItems='center';left.style.gap='10px';left.style.flex='1';
        const info=el('div');
        info.appendChild(el('div',{class:'appt-row-name'},[a.studentName]));
        info.appendChild(el('div',{class:'appt-row-sub'},[a.confirmed?'✓ Asistencia confirmada':'Pendiente de confirmación']));
        left.appendChild(info);
        row.appendChild(left);
        // Confirm checkbox button
        const confBtn=mkBtn(a.confirmed?'✓ Confirmada':'Confirmar asistencia',()=>toggleConfirmAppt(dk2,slotId,a.id),{
          background:a.confirmed?'var(--sec)':'var(--yoga)',
          color:a.confirmed?'#fff':'var(--pri)',
          border:a.confirmed?'none':'1px solid var(--yogab)',
          padding:'6px 10px',fontSize:'10px',marginRight:'6px'
        });
        row.appendChild(confBtn);
        row.appendChild(mkDangerBtn('✕',()=>removeAppointment(dk2,slotId,a.id)));
        box.appendChild(row);
      });
    }

    // Add appointment button
    if(cupoLeft>0&&S.students.length){
      box.appendChild(el('div',{style:{fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',color:'var(--muted)',margin:'14px 0 8px'}},['Agendar estudiante']));
      // Students not yet in this slot
      const alreadyIn=appts.map(a=>a.studentId);
      const available=S.students.filter(s=>!alreadyIn.includes(s.id));
      if(!available.length){
        box.appendChild(el('div',{style:{fontSize:'13px',color:'var(--muted)'}},['Todas las estudiantes ya están agendadas']));
      } else {
        const sel=el('select',{class:'inp',style:{marginBottom:'8px'}});
        sel.appendChild(el('option',{value:''},[`— Selecciona estudiante (${available.length} disponibles) —`]));
        available.forEach(s=>{
          const rem=s.packages.reduce((a,p)=>a+p.remaining,0);
          const opt=el('option',{value:s.id},[`${s.name} (${rem} clases)`]);
          sel.appendChild(opt);
        });
        box.appendChild(sel);
        box.appendChild(mkBtn('+ Agendar',()=>{
          if(!sel.value){alert('Selecciona una estudiante.');return;}
          addAppointment(dk2,slotId,sel.value);
        },{background:'var(--pri)',color:'#fff',padding:'10px 20px',fontSize:'12px',width:'100%'}));
      }
    } else if(!S.students.length){
      box.appendChild(el('div',{style:{fontSize:'13px',color:'var(--muted)',marginTop:'14px'}},['Primero agrega estudiantes en la sección Estudiantes']));
    }
    ov.appendChild(box);
  }
  return ov;
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
