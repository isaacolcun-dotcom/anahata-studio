<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anahata — Gestión de Estudio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C4856A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anahata">
<link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:#FAF6F1;color:#3D2B1F;min-height:100vh}
:root{--pri:#C4856A;--sec:#8FAF8F;--dark:#3D2B1F;--muted:#9B8B7E;--acc:#E8D5C4;--white:#FFFFFF;--yoga:#FBF5EE;--yogab:#E8D5C4;--pole:#EEF5F5;--poleb:#C5DDD9;--danger:#C45A5A;--dangerBg:#FFF0F0}
input,select,button,textarea{font-family:'Lato',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#F0E8E0}::-webkit-scrollbar-thumb{background:var(--pri);border-radius:4px}
.inp{border:1.5px solid var(--acc);border-radius:8px;padding:10px 14px;font-size:13px;outline:none;width:100%;background:#FFFDF9;color:var(--dark);transition:border-color .2s}
.inp:focus{border-color:var(--pri)}
.card{background:var(--white);border-radius:14px;box-shadow:0 2px 18px rgba(61,43,31,.07)}
.tag{display:inline-flex;align-items:center;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 9px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade{animation:fadeUp .25s ease forwards}
.overlay{position:fixed;inset:0;background:rgba(61,43,31,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(3px)}
#app{display:flex;flex-direction:column;min-height:100vh}
header{background:var(--dark);padding:0 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;flex-shrink:0;flex-wrap:wrap}
.logo-area{padding:14px 0}
.logo-name{font-family:'Playfair Display',serif;font-size:18px;color:var(--pri);letter-spacing:4px}
.logo-sub{font-size:9px;letter-spacing:3px;color:var(--sec);text-transform:uppercase;margin-top:2px}
nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap}
.nav-btn{cursor:pointer;border:none;padding:9px 15px;font-size:11px;letter-spacing:.5px;background:transparent;color:#9B8B7E;border-radius:7px;transition:all .18s;font-family:'Lato',sans-serif;font-weight:700}
.nav-btn.active{background:var(--pri);color:#fff}
.nav-btn:hover:not(.active){color:#fff;background:rgba(196,133,106,.25)}
main{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%}
h1.pg{font-family:'Playfair Display',serif;font-size:26px;color:var(--dark);margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat-card{padding:22px 20px}
.stat-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.stat-val{font-family:'Playfair Display',serif;font-size:34px;font-weight:700}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px}
.pkg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pkg-card{padding:24px 20px;border-left:4px solid var(--pri)}
.pkg-title{font-family:'Playfair Display',serif;font-size:18px}
.pkg-price{font-size:34px;font-weight:700;margin:6px 0 4px}
.pkg-sub{font-size:12px;color:var(--muted)}
.pkg-rate{font-size:11px;color:var(--sec);margin-top:6px}
.stu-list{display:flex;flex-direction:column;gap:10px}
.stu-card{padding:18px 20px;display:flex;align-items:center;gap:16px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex-shrink:0;background:linear-gradient(135deg,var(--pri),var(--sec))}
.stu-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.cal-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.week-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.week-lbl{font-size:13px;color:var(--muted);min-width:220px;text-align:center}
.cal-table{width:100%;border-collapse:separate;border-spacing:3px 3px;font-size:12px}
.cal-th{padding:9px 6px;text-align:center;font-weight:700;font-size:11px;color:var(--dark)}
.cal-th.today{color:var(--pri);border-bottom:2px solid var(--pri)}
.time-cell{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;padding:3px 8px;vertical-align:middle}
.class-cell{border-radius:8px;padding:6px 7px;cursor:pointer;transition:transform .15s;min-height:46px;border:1px solid transparent}
.class-cell:hover{transform:scale(1.04)}
.class-cell.yoga{background:var(--yoga);border-color:var(--yogab)}
.class-cell.pole{background:var(--pole);border-color:var(--poleb)}
.class-type{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.class-cell.yoga .class-type{color:var(--pri)}
.class-cell.pole .class-type{color:var(--sec)}
.att-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.att-dot{width:17px;height:17px;border-radius:50%;background:var(--pri);color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.att-count{font-size:9px;color:var(--muted);margin-left:2px;line-height:17px}
.empty-cell{background:#F5F0EB;border-radius:8px;opacity:.3}
.break-row td{padding:6px 0;text-align:center;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.receipt-row{display:grid;grid-template-columns:120px 1fr 130px 90px 130px 110px;gap:0;align-items:center;padding:13px 18px;border-top:1px solid #F0E8E0;font-size:13px}
.receipt-hdr{background:#F5F0EB;padding:9px 18px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:grid;grid-template-columns:120px 1fr 130px 90px 130px 110px}
.folio-badge{display:inline-block;background:#FBF0E8;border-radius:6px;padding:4px 10px;font-size:10px;letter-spacing:1px;color:var(--pri);font-weight:700;font-family:monospace}
.modal-box{background:var(--white);border-radius:16px;width:100%;max-width:480px;padding:26px;animation:fadeUp .22s ease;max-height:92vh;overflow-y:auto}
.modal-title{font-family:'Playfair Display',serif;font-size:19px;color:var(--dark);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.form-group{margin-bottom:13px}
.form-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.pkg-option{width:100%;background:#FFFDF9;border-radius:10px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .18s;margin-bottom:10px;border:2px solid var(--acc)}
.pkg-option:hover{transform:translateY(-1px)}
.pkg-option-name{font-weight:700;font-size:15px}
.pkg-option-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pkg-option-price{font-size:26px;font-weight:700}
.empty-state{padding:50px;text-align:center}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-txt{font-family:'Playfair Display',serif;font-size:18px;color:var(--muted)}
.empty-sub{font-size:13px;color:var(--muted);margin-top:6px}
.recent-hdr{display:grid;grid-template-columns:1fr 1fr 1fr auto;padding:8px 18px;background:#F5F0EB;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.recent-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;padding:12px 18px;border-top:1px solid #F0E8E0;align-items:center;font-size:13px}
.leg{display:flex;gap:16px;margin-top:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:6px}
.leg-box{width:14px;height:14px;border-radius:3px;flex-shrink:0}
#status-bar{padding:4px 10px;font-size:10px;font-weight:700;border-radius:20px;transition:all .3s}
#status-bar.online{color:var(--sec)}
#status-bar.offline{color:#C45A5A;animation:pulse 2s infinite}
#status-bar.saving{color:var(--muted)}
#install-btn{display:none;cursor:pointer;border:1.5px solid var(--pri);background:transparent;color:var(--pri);padding:7px 14px;border-radius:7px;font-size:10px;font-weight:700;font-family:'Lato',sans-serif}
#install-btn.show{display:block}
.loading-screen{position:fixed;inset:0;background:#FAF6F1;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.spinner{width:32px;height:32px;border:3px solid var(--acc);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
.loading-lbl{font-family:'Playfair Display',serif;font-size:18px;color:var(--pri)}
.loading-sub{font-size:12px;color:var(--muted);margin-top:6px}
/* Pkg item row in student detail */
.pkg-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:8px;border:1.5px solid var(--acc);background:#FFFDF9}
.pkg-row-info{flex:1}
.pkg-row-name{font-weight:700;font-size:13px}
.pkg-row-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pkg-bar-wrap{background:#F0EBE5;border-radius:10px;height:6px;margin-top:6px;overflow:hidden}
.pkg-bar{height:6px;border-radius:10px;background:var(--sec);transition:width .4s}
/* Danger zone */
.danger-zone{margin-top:20px;padding-top:16px;border-top:1px dashed #FFAAAA}
.danger-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--danger);margin-bottom:10px}
@media(max-width:700px){.stats-grid{grid-template-columns:1fr 1fr}.pkg-grid{grid-template-columns:1fr}.receipt-row,.receipt-hdr{grid-template-columns:100px 1fr auto}.week-lbl{min-width:150px;font-size:11px}}
</style>
</head>
<body>
 
<div id="loading-screen" class="loading-screen">
  <div class="spinner"></div>
  <div class="loading-lbl">ANAHATA</div>
  <div class="loading-sub" id="loading-msg">Conectando con Firebase...</div>
</div>
<div id="app" style="display:none;flex-direction:column;min-height:100vh"></div>
 
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
// ── Firebase config ────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:            "AIzaSyDh5Tf348VS71KfQOocRSnYq1q9Q5YqYpo",
  authDomain:        "hanahata-79d88.firebaseapp.com",
  projectId:         "hanahata-79d88",
  storageBucket:     "hanahata-79d88.firebasestorage.app",
  messagingSenderId: "730963561138",
  appId:             "1:730963561138:web:708eca70e88611e790d7ab"
});
const db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
 
// ── Constantes ─────────────────────────────────────────────────────
const PKG = {
  '12':{label:'12 Clases',   price:800,classes:12,color:'#8FAF8F'},
  '8': {label:'8 Clases',    price:600,classes:8, color:'#C4856A'},
  '1': {label:'Clase Suelta',price:100,classes:1, color:'#B8A9C9'}
};
const SLOTS=[
  {id:'s1',time:'7:00–8:00'},{id:'s2',time:'8:10–9:10'},
  {id:'s3',time:'9:20–10:20'},{id:'s4',time:'10:30–11:30'},
  {id:'s5',time:'17:00–18:00'},{id:'s6',time:'18:10–19:10'},
  {id:'s7',time:'19:20–20:20'},{id:'s8',time:'20:30–21:30'}
];
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb'];
const CM={
  Lun: {s1:'yoga',s2:'yoga',s3:'pole',s4:'pole',s5:'yoga',s6:'yoga',s7:'pole',s8:'pole'},
  Mar: {s1:'yoga',s2:'yoga',s3:'pole',s4:'pole',s5:'pole',s6:'pole',s7:'yoga',s8:'yoga'},
  'Mié':{s1:'yoga',s2:'yoga',s3:'pole',s4:'pole',s5:'yoga',s6:'yoga',s7:'pole',s8:'pole'},
  Jue: {s1:'yoga',s2:'yoga',s3:'pole',s4:'pole',s5:'pole',s6:'pole',s7:'yoga',s8:'yoga'},
  Vie: {s1:'yoga',s2:'yoga',s3:'pole',s4:'pole',s5:'yoga',s6:'yoga',s7:'pole',s8:'pole'},
  'Sáb':{s1:'yoga',s2:'yoga',s3:'pole',s4:'pole'}
};
 
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtDate=d=>new Date(d).toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtLong=d=>new Date(d).toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
const getMonday=d=>{const r=new Date(d),w=r.getDay();r.setDate(r.getDate()-(w===0?6:w-1));r.setHours(0,0,0,0);return r};
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const dKey=d=>d.toISOString().slice(0,10);
 
let S={tab:'dashboard',students:[],attendance:{},receipts:[],weekStart:getMonday(new Date()),modal:null};
let saveT=null,remoteUpd=false;
 
// ── Firestore ──────────────────────────────────────────────────────
db.collection('estudio').doc('principal').onSnapshot(snap=>{
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  if(snap.exists){
    remoteUpd=true;
    const d=snap.data();
    S.students=d.students||[];S.attendance=d.attendance||{};S.receipts=d.receipts||[];
    remoteUpd=false;
  }
  render();setStatus(navigator.onLine?'online':'offline');
},()=>{
  document.getElementById('loading-msg').textContent='Error de conexión, reintentando...';
  setTimeout(()=>location.reload(),4000);
});
 
function save(){
  if(remoteUpd)return;
  if(saveT)clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    setStatus('saving');
    try{
      await db.collection('estudio').doc('principal').set({
        students:S.students,attendance:S.attendance,receipts:S.receipts,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      setStatus(navigator.onLine?'online':'offline');
    }catch(e){setStatus('offline');}
  },800);
}
function setStatus(t){
  const b=document.getElementById('status-bar');if(!b)return;
  b.className=t;b.id='status-bar';
  b.textContent=t==='online'?'● En línea':t==='offline'?'● Sin conexión':'↑ Guardando...';
}
window.addEventListener('online',()=>setStatus('online'));
window.addEventListener('offline',()=>setStatus('offline'));
 
let dp=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;const b=document.getElementById('install-btn');if(b)b.classList.add('show');});
function installApp(){if(!dp)return;dp.prompt();dp.userChoice.then(()=>{dp=null;const b=document.getElementById('install-btn');if(b)b.classList.remove('show');});}
 
function setState(p,sv=true){S={...S,...p};if(sv)save();render();}
 
// ── Business logic ─────────────────────────────────────────────────
function addStudent(name,phone,email){
  setState({students:[...S.students,{id:uid(),name,phone,email,packages:[],createdAt:new Date().toISOString()}],modal:null});
}
 
function deleteStudent(sid){
  if(!confirm('¿Eliminar esta estudiante y todos sus datos? Esta acción no se puede deshacer.'))return;
  setState({students:S.students.filter(s=>s.id!==sid),modal:null});
}
 
function addPackage(sid,pt){
  const pkg=PKG[pt],stu=S.students.find(s=>s.id===sid);
  const np={id:uid(),type:pt,label:pkg.label,total:pkg.classes,remaining:pkg.classes,price:pkg.price,purchasedAt:new Date().toISOString()};
  const r={id:uid(),folio:`ANA-${Date.now().toString().slice(-6)}`,studentId:sid,studentName:stu.name,phone:stu.phone,pkgLabel:pkg.label,classes:pkg.classes,amount:pkg.price,date:new Date().toISOString()};
  setState({students:S.students.map(s=>s.id!==sid?s:{...s,packages:[...s.packages,np]}),receipts:[r,...S.receipts],modal:null});
  if(confirm(`Recibo ${r.folio} generado.\n¿Imprimir/PDF ahora?`))printReceipt(r);
}
 
function deletePackage(sid,pkgId){
  if(!confirm('¿Eliminar este paquete?'))return;
  setState({students:S.students.map(s=>s.id!==sid?s:{...s,packages:s.packages.filter(p=>p.id!==pkgId)}),modal:null});
}
 
function toggleAtt(ds,slotId,sid){
  const key=`${ds}_${slotId}`,cur=S.attendance[key]||[],isIn=cur.includes(sid);
  if(!isIn){
    const stu=S.students.find(s=>s.id===sid),pkg=stu?.packages.find(p=>p.remaining>0);
    if(!pkg){alert(`${stu?.name} no tiene clases disponibles.\nAgrégale un paquete primero.`);return;}
    setState({attendance:{...S.attendance,[key]:[...cur,sid]},students:S.students.map(s=>s.id!==sid?s:{...s,packages:s.packages.map(p=>p.id!==pkg.id?p:{...p,remaining:p.remaining-1})})});
  }else{
    const stu=S.students.find(s=>s.id===sid),pr=[...stu.packages].reverse().find(p=>p.remaining<p.total);
    setState({attendance:{...S.attendance,[key]:cur.filter(id=>id!==sid)},students:!pr?S.students:S.students.map(s=>s.id!==sid?s:{...s,packages:s.packages.map(p=>p.id!==pr.id?p:{...p,remaining:Math.min(p.remaining+1,p.total)})})});
  }
}
 
// ── Receipt ────────────────────────────────────────────────────────
function printReceipt(r){
  const w=window.open('','_blank','width=600,height=820');
  if(!w){alert('Habilita ventanas emergentes.');return;}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Recibo ${r.folio}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Lato',sans-serif;background:#FAF6F1;display:flex;justify-content:center;padding:40px}
.c{background:#fff;width:480px;padding:44px;border-radius:16px;box-shadow:0 8px 40px rgba(61,43,31,.12)}
.h1{font-family:'Playfair Display',serif;font-size:30px;letter-spacing:6px;color:#C4856A;text-align:center}
.sub{font-size:9px;letter-spacing:4px;color:#8FAF8F;text-transform:uppercase;text-align:center;margin-top:4px;display:block}
hr{border:none;border-top:1px solid #E8D5C4;margin:20px 0}
.badge{display:block;text-align:center;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#8FAF8F;margin-bottom:6px}
.folio{text-align:center;font-size:22px;font-weight:700;color:#3D2B1F;font-family:'Playfair Display',serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}
.lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#8FAF8F;display:block;margin-bottom:3px}
.val{font-size:14px;color:#3D2B1F}
.tot{background:#FBF0E8;border-radius:12px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.tl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8FAF8F}
.ta{font-size:36px;font-weight:700;color:#C4856A}
.foot{text-align:center;margin-top:24px;padding-top:18px;border-top:1px solid #E8D5C4;font-size:11px;color:#9B8B7E;line-height:2}
@media print{body{background:#fff;padding:0}.c{box-shadow:none;border-radius:0;width:100%}}</style>
</head><body><div class="c">
<p class="h1">ANAHATA</p><span class="sub">Movimiento con el corazón</span><hr>
<span class="badge">Recibo de Pago</span><p class="folio">${r.folio}</p>
<div class="grid">
  <div><span class="lbl">Estudiante</span><span class="val">${r.studentName}</span></div>
  <div><span class="lbl">Teléfono</span><span class="val">${r.phone||'—'}</span></div>
  <div><span class="lbl">Fecha</span><span class="val">${fmtLong(r.date)}</span></div>
  <div><span class="lbl">Paquete</span><span class="val">${r.pkgLabel}</span></div>
  <div><span class="lbl">Clases</span><span class="val">${r.classes} ${r.classes===1?'clase':'clases'}</span></div>
  <div><span class="lbl">Vigencia</span><span class="val">30 días</span></div>
</div>
<div class="tot"><div><p class="tl">Total Pagado</p></div><div><span class="ta">$${r.amount}</span> <span style="font-size:13px;color:#9B8B7E">MXN</span></div></div>
<div class="foot"><div>📍 200 casi esq con Paris. Frente al Cinépolis</div><div>📱 (644) 260-2332 · 📷 @anahata.est</div><p style="font-style:italic;color:#C4856A;margin-top:8px">¡Gracias por tu confianza!</p></div>
</div></body></html>`);
  w.document.close();setTimeout(()=>{w.focus();w.print();},700);
}
 
// ── DOM helpers ────────────────────────────────────────────────────
function el(tag,attrs={},ch=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')e.className=v;
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else e.setAttribute(k,v);
  }
  for(const c of ch)if(c!=null)typeof c==='string'?e.appendChild(document.createTextNode(c)):e.appendChild(c);
  return e;
}
const div=(cls,ch=[],a={})=>el('div',{class:cls,...a},ch);
function mkBtn(label,onClick,s={}){
  const b=el('button',{onClick},[label]);
  Object.assign(b.style,{cursor:'pointer',border:'none',borderRadius:'8px',fontWeight:'700',fontFamily:"'Lato',sans-serif",...s});
  return b;
}
function mkDangerBtn(label,onClick){
  return mkBtn(label,onClick,{background:'var(--dangerBg)',color:'var(--danger)',padding:'8px 14px',fontSize:'11px',border:'1px solid #FFAAAA'});
}
 
// ── Render ─────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');if(!app)return;
  app.innerHTML='';app.appendChild(renderHeader());
  const main=document.createElement('main');
  if(S.tab==='dashboard')main.appendChild(renderDashboard());
  else if(S.tab==='students')main.appendChild(renderStudents());
  else if(S.tab==='calendar')main.appendChild(renderCalendar());
  else if(S.tab==='receipts')main.appendChild(renderReceipts());
  app.appendChild(main);
  if(S.modal)app.appendChild(renderModal());
}
 
function renderHeader(){
  const h=el('header');

  const nav=el('nav');

}

    wrap.appendChild(el('h3',{style:{fontFamily:"'Playfair Display',serif",fontSize:'18px',margin:'24px 0 14px'}},['Últimos recibos']));
    const rc=div('card',[],{style:{overflow:'hidden'}});
    const hdr=div('recent-hdr');['Folio','Estudiante','Paquete','Acción'].forEach(t=>hdr.appendChild(el('span',[],[t])));rc.appendChild(hdr);
    S.receipts.slice(0,5).forEach(r=>{
      const row=div('recent-row');
      row.appendChild(el('span',{class:'folio-badge'},[r.folio]));
      row.appendChild(el('span',[],[r.studentName]));

    if(!s.packages.length)tags.appendChild(el('span',{class:'tag',style:{background:'#FFF0F0',color:'#AA4444',border:'1px solid #FFAAAA'}},['Sin paquete']));
    else s.packages.forEach(p=>tags.appendChild(el('span',{class:'tag',style:{background:p.remaining>0?'#F0F7F0':'#F5F5F5',color:p.remaining>0?'#4A7A4A':'var(--muted)',border:`1px solid ${p.remaining>0?'#8FAF8F':'#DDD'}`}},[`${p.label}: ${p.remaining}/${p.total}`])));
    info.appendChild(tags);

    right.appendChild(el('div',{style:{fontSize:'10px',color:'var(--muted)'}},['clases']));
    // Botones de acción
    const actions=el('div',{style:{display:'flex',gap:'6px',marginTop:'4px'}});
    actions.appendChild(mkBtn('✏️ Ver / Editar',()=>setState({modal:`stuDetail:${s.id}`},false),{background:'var(--acc)',color:'var(--dark)',padding:'6px 10px',fontSize:'11px'}));
    actions.appendChild(mkBtn('+ Paquete',()=>setState({modal:`addPkg:${s.id}`},false),{background:'var(--pri)',color:'#fff',padding:'6px 10px',fontSize:'11px'}));

    card.appendChild(av);card.appendChild(info);card.appendChild(right);list.appendChild(card);
  });
  wrap.appendChild(list);return wrap;

function renderCalendar(){
  const wrap=div('fade');
  const wd=DAYS.map((_,i)=>addDays(S.weekStart,i)),tk=dKey(new Date());
  const top=div('cal-header');
  top.appendChild(el('h1',{class:'pg',style:{marginBottom:'0'}},['Calendario']));
  const wnav=div('week-nav');
  const d0=wd[0].toLocaleDateString('es-MX',{day:'numeric',month:'short'});
  const d5=wd[5].toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
  wnav.appendChild(mkBtn('‹',()=>setState({weekStart:addDays(S.weekStart,-7)},false),{background:'var(--acc)',color:'var(--dark)',padding:'7px 14px',fontSize:'17px'}));
  wnav.appendChild(el('span',{class:'week-lbl'},[`${d0} — ${d5}`]));
  wnav.appendChild(mkBtn('›',()=>setState({weekStart:addDays(S.weekStart,7)},false),{background:'var(--acc)',color:'var(--dark)',padding:'7px 14px',fontSize:'17px'}));
  wnav.appendChild(mkBtn('Hoy',()=>setState({weekStart:getMonday(new Date())},false),{background:'var(--pri)',color:'#fff',padding:'7px 14px',fontSize:'11px'}));
  top.appendChild(wnav);wrap.appendChild(top);
  const tw=el('div',{style:{overflowX:'auto'}});
  const table=el('table',{class:'cal-table'}),thead=el('thead'),hrow=el('tr');

  DAYS.forEach((d,i)=>{
    const it=dKey(wd[i])===tk;
    hrow.appendChild(el('th',{class:`cal-th${it?' today':''}`},[d,el('br'),el('span',{style:{fontSize:'10px',fontWeight:'400',color:it?'var(--pri)':'var(--muted)'}},[String(wd[i].getDate())])]));

    row.appendChild(el('td',{class:'time-cell'},[slot.time]));
    DAYS.forEach((day,di)=>{
      const ct=CM[day]?.[slot.id],dk2=dKey(wd[di]),ak=`${dk2}_${slot.id}`,att=S.attendance[ak]||[];
      const td=el('td',{style:{padding:'2px',verticalAlign:'top'}});
      if(!ct){const ec=div('empty-cell');ec.style.height='46px';td.appendChild(ec);}
      else{
        const cc=div(`class-cell ${ct}`);
        cc.onclick=()=>setState({modal:`slot:${day}:${dk2}:${slot.id}`},false);
        cc.appendChild(el('div',{class:'class-type'},[ct==='yoga'?'Yoga':'Pole Fitness']));
        if(att.length){
          const dots=div('att-dots');
          att.forEach(id=>{const stu=S.students.find(s=>s.id===id);if(stu){const d=div('att-dot');d.textContent=stu.name.charAt(0).toUpperCase();d.title=stu.name;dots.appendChild(d);}});
          dots.appendChild(el('span',{class:'att-count'},[String(att.length)]));cc.appendChild(dots);
        }
        td.appendChild(cc);
      }
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);tw.appendChild(table);wrap.appendChild(tw);
  const leg=div('leg');
  leg.appendChild(el('div',{class:'leg-item'},[el('span',{class:'leg-box',style:{background:'var(--yoga)',border:'1px solid var(--yogab)'}}),el('span',[],['Yoga'])]));
  leg.appendChild(el('div',{class:'leg-item'},[el('span',{class:'leg-box',style:{background:'var(--pole)',border:'1px solid var(--poleb)'}}),el('span',[],['Pole Fitness'])]));
  leg.appendChild(el('div',{class:'leg-item'},[el('span',[],[' ✦ Clic en clase para registrar asistencia'])]));

// ── Modals ─────────────────────────────────────────────────────────
function renderModal(){
  const ov=div('overlay');
  ov.onclick=e=>{if(e.target===ov)setState({modal:null},false);};
  const xs={background:'none',border:'none',fontSize:'20px',cursor:'pointer',color:'var(--muted)',lineHeight:'1'};
 
  // ── Nueva estudiante ──
  if(S.modal==='newStudent'){
    const box=div('modal-box');
    box.appendChild(div('modal-title',[el('span',{style:{fontFamily:"'Playfair Display',serif"}},['Nueva Estudiante']),mkBtn('✕',()=>setState({modal:null},false),xs)]));
    let name='',phone='',email='';
    const ni=el('input',{class:'inp',placeholder:'Nombre completo',type:'text'});
    const pi=el('input',{class:'inp',placeholder:'(644) 000-0000',type:'tel'});
    const ei=el('input',{class:'inp',placeholder:'correo@ejemplo.com',type:'email'});
    ni.oninput=e=>name=e.target.value;pi.oninput=e=>phone=e.target.value;ei.oninput=e=>email=e.target.value;
    [['NOMBRE *',ni],['TELÉFONO',pi],['EMAIL',ei]].forEach(([l,inp])=>{
      const g=div('form-group');g.appendChild(el('label',{class:'form-label'},[l]));g.appendChild(inp);box.appendChild(g);
    });
    const br=el('div',{style:{display:'flex',gap:'10px',marginTop:'14px'}});
    br.appendChild(mkBtn('Cancelar',()=>setState({modal:null},false),{flex:'1',background:'var(--acc)',color:'var(--dark)',padding:'12px 0',fontSize:'12px'}));
    br.appendChild(mkBtn('Guardar',()=>{if(!name.trim()){ni.style.borderColor='#AA4444';ni.focus();return;}addStudent(name.trim(),phone.trim(),email.trim());},{flex:'2',background:'var(--pri)',color:'#fff',padding:'12px 0',fontSize:'12px'}));
    box.appendChild(br);ov.appendChild(box);
  }
 
  // ── Detalle / editar estudiante ──
  else if(S.modal?.startsWith('stuDetail:')){
    const sid=S.modal.split(':')[1];
    const stu=S.students.find(s=>s.id===sid);
    if(!stu){setState({modal:null},false);return ov;}
    const box=div('modal-box');
    box.appendChild(div('modal-title',[
      el('span',{style:{fontFamily:"'Playfair Display',serif"}},[stu.name]),
      mkBtn('✕',()=>setState({modal:null},false),xs)
    ]));
    // Info
    box.appendChild(el('div',{style:{fontSize:'12px',color:'var(--muted)',marginBottom:'16px'}},[
      stu.phone?`📱 ${stu.phone}  `:' ',
      stu.email?`✉️ ${stu.email}`:''
    ]));
 
    // Paquetes actuales
    box.appendChild(el('div',{style:{fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',color:'var(--muted)',marginBottom:'8px'}},['Paquetes']));
    if(!stu.packages.length){
      box.appendChild(el('div',{style:{fontSize:'13px',color:'var(--muted)',marginBottom:'12px'}},['Sin paquetes asignados.']));
    } else {
      stu.packages.forEach(p=>{
        const pct=Math.round((p.remaining/p.total)*100);
        const row=div('pkg-row');
        const info=el('div',{class:'pkg-row-info'});
        info.appendChild(el('div',{class:'pkg-row-name'},[p.label]));
        info.appendChild(el('div',{class:'pkg-row-sub'},[`${p.remaining} de ${p.total} clases restantes · Comprado: ${fmtDate(p.purchasedAt)}`]));
        const barWrap=div('pkg-bar-wrap');
        const bar=div('pkg-bar');
        bar.style.width=`${pct}%`;
        bar.style.background=p.remaining>0?'var(--sec)':'#DDD';
        barWrap.appendChild(bar);info.appendChild(barWrap);
        row.appendChild(info);
        row.appendChild(mkDangerBtn('🗑',()=>deletePackage(sid,p.id)));
        box.appendChild(row);
      });
    }
 
    // Botón agregar nuevo paquete
    const addPkgBtn=mkBtn('+ Agregar nuevo paquete',()=>setState({modal:`addPkg:${sid}`},false),{width:'100%',background:'var(--pri)',color:'#fff',padding:'12px 0',fontSize:'12px',marginTop:'8px'});
    box.appendChild(addPkgBtn);
 
    // Zona de peligro
    const dz=div('danger-zone');
    dz.appendChild(el('div',{class:'danger-title'},['⚠ Zona de riesgo']));
    dz.appendChild(mkDangerBtn('🗑 Eliminar estudiante permanentemente',()=>deleteStudent(sid)));
    box.appendChild(dz);
    ov.appendChild(box);
  }
 
  // ── Agregar paquete ──
  else if(S.modal?.startsWith('addPkg:')){
    const sid=S.modal.split(':')[1],stu=S.students.find(s=>s.id===sid);
    const box=div('modal-box');
    box.appendChild(div('modal-title',[el('span',{style:{fontFamily:"'Playfair Display',serif"}},['Nuevo paquete']),mkBtn('✕',()=>setState({modal:null},false),xs)]));
    box.appendChild(el('div',{style:{fontSize:'12px',color:'var(--muted)',marginBottom:'16px'}},[`Para: ${stu?.name||''}`]));
    Object.entries(PKG).forEach(([k,p])=>{
      const opt=div('pkg-option');opt.style.borderColor=p.color;opt.onclick=()=>addPackage(sid,k);
      const info=el('div');
      info.appendChild(el('div',{class:'pkg-option-name'},[p.label]));
      info.appendChild(el('div',{class:'pkg-option-sub'},[`${p.classes} ${p.classes===1?'clase':'clases'}${p.classes>1?` · $${(p.price/p.classes).toFixed(0)}/clase`:''}`]));
      opt.appendChild(info);opt.appendChild(el('div',{class:'pkg-option-price',style:{color:p.color}},[`$${p.price}`]));box.appendChild(opt);
    });
    // Botón regresar al detalle
    box.appendChild(mkBtn('← Regresar',()=>setState({modal:`stuDetail:${sid}`},false),{background:'var(--acc)',color:'var(--dark)',padding:'10px 16px',fontSize:'11px',marginTop:'4px'}));
    ov.appendChild(box);
  }
 
  // ── Clase / asistencia ──
  else if(S.modal?.startsWith('slot:')){
    const[,day,dk2,slotId]=S.modal.split(':'),slot=SLOTS.find(s=>s.id===slotId),ct=CM[day]?.[slotId];
    const att=S.attendance[`${dk2}_${slotId}`]||[];
    const dl=new Date(dk2+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    const box=div('modal-box');
    box.appendChild(div('modal-title',[el('span',{style:{fontFamily:"'Playfair Display',serif"}},[ct==='yoga'?'Yoga':'Pole Fitness']),mkBtn('✕',()=>setState({modal:null},false),xs)]));
    box.appendChild(el('div',{style:{fontSize:'12px',color:'var(--muted)',marginBottom:'6px'}},[`${slot?.time} · ${dl}`]));
    box.appendChild(el('div',{style:{fontSize:'12px',color:'var(--muted)',marginBottom:'14px'}},['Toca una estudiante para marcar / quitar asistencia']));
    if(!S.students.length){box.appendChild(el('div',{style:{textAlign:'center',color:'var(--muted)',padding:'20px'}},['Sin estudiantes registradas']));}
    else S.students.forEach(s=>{
      const isA=att.includes(s.id),rem=s.packages.reduce((a,p)=>a+p.remaining,0);
      const opt=el('div',{onClick:()=>toggleAtt(dk2,slotId,s.id)});
      Object.assign(opt.style,{background:isA?'#F0F7F0':'#FFFDF9',border:`1.5px solid ${isA?'var(--sec)':'var(--acc)'}`,borderRadius:'10px',padding:'12px 15px',display:'flex',alignItems:'center',gap:'12px',marginBottom:'8px',cursor:'pointer',opacity:(rem>0||isA)?'1':'0.5',transition:'all .18s'});
      opt.onmouseover=()=>opt.style.transform='translateY(-1px)';opt.onmouseout=()=>opt.style.transform='none';
      const av=el('div');Object.assign(av.style,{width:'34px',height:'34px',borderRadius:'50%',flexShrink:'0',background:isA?'var(--sec)':'var(--acc)',display:'flex',alignItems:'center',justifyContent:'center',color:isA?'#fff':'var(--dark)',fontWeight:'700',fontSize:'14px'});
      av.textContent=isA?'✓':s.name.charAt(0).toUpperCase();
      const info=el('div',{style:{flex:'1'}});
      info.appendChild(el('div',{style:{fontWeight:'700',fontSize:'14px'}},[s.name]));
      info.appendChild(el('div',{style:{fontSize:'11px',color:'var(--muted)',marginTop:'2px'}},[`${rem} clases restantes`]));
      opt.appendChild(av);opt.appendChild(info);
      opt.appendChild(el('div',{style:{fontSize:'11px',color:isA?'var(--sec)':'var(--muted)',fontWeight:isA?'700':'400'}},[isA?'✓ Asistió':'Marcar']));
      box.appendChild(opt);
    });
    ov.appendChild(box);
  }
  return ov;
}
