<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anahata — Gestión de Estudio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C4856A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anahata">
<link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pri:#C4856A;--pri-light:#F2E3DA;--pri-dark:#A36850;
  --sec:#7BA898;--sec-light:#E8F3F1;--sec-dark:#5A8B7A;
  --dark:#1E1510;--dark2:#3D2B1F;--mid:#6B5448;
  --muted:#9B8B7E;--acc:#E8D5C4;--acc2:#F5EDE5;
  --bg:#FAF7F4;--white:#FFFFFF;
  --yoga-bg:#FBF4EE;--yoga-bd:#E8D5C4;
  --pole-bg:#EFF5F4;--pole-bd:#C2DAD5;
  --danger:#C45A5A;--danger-bg:#FFF0F0;--danger-bd:#FFCCCC;
  --gold:#D4A96A;--gold-light:#FBF3E5;
  --green:#4A7A5A;--green-bg:#EDF7EF;
  --blue:#3E72A8;--blue-bg:#EBF3FC;
  --surface:#FFFFFF;--surface2:#F8F4F0;
  --border:#EDE5DC;--border2:#F2EBE2;
  --shadow:0 2px 20px rgba(61,43,31,.08);
  --shadow-lg:0 8px 40px rgba(61,43,31,.14);
  --r:12px;--r-sm:8px;--r-lg:18px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--dark2);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,button,textarea{font-family:'Inter',sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--acc);border-radius:6px}
 
/* ── Inputs ── */
.inp{border:1.5px solid var(--border);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;outline:none;width:100%;background:var(--white);color:var(--dark2);transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-light)}
.inp-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px;font-weight:600}
.form-group{margin-bottom:14px}
 
/* ── Buttons ── */
.btn{cursor:pointer;border:none;border-radius:var(--r-sm);font-weight:600;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px;transition:all .18s;font-size:13px;padding:10px 18px}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{background:var(--pri-dark);transform:translateY(-1px)}
.btn-sec{background:var(--sec);color:#fff}.btn-sec:hover{background:var(--sec-dark)}
.btn-ghost{background:transparent;color:var(--mid);border:1.5px solid var(--border)}.btn-ghost:hover{border-color:var(--pri);color:var(--pri)}
.btn-dark{background:var(--dark2);color:#fff}.btn-dark:hover{background:var(--dark)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bd)}.btn-danger:hover{background:#FFDDDD}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-lg{padding:13px 24px;font-size:14px}
.btn-icon{padding:8px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .18s;color:var(--mid)}
.btn-icon:hover{background:var(--pri-light);color:var(--pri)}
 
/* ── Cards ── */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--border2)}
.card-inner{padding:20px}
 
/* ── Tags / Badges ── */
.tag{display:inline-flex;align-items:center;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;gap:4px}
.tag-yoga{background:var(--yoga-bg);color:var(--pri);border:1px solid var(--yoga-bd)}
.tag-pole{background:var(--pole-bg);color:var(--sec-dark);border:1px solid var(--pole-bd)}
.tag-promo{background:var(--gold-light);color:#8B6020;border:1px solid #E8C87A}
.tag-active{background:var(--green-bg);color:var(--green);border:1px solid #A8D4B4}
.tag-inactive{background:#F5F5F5;color:#888;border:1px solid #DDD}
.tag-ef{background:var(--green-bg);color:var(--green);border:1px solid #A8D4B4}
.tag-tr{background:var(--blue-bg);color:var(--blue);border:1px solid #90B8E8}
 
/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.fade{animation:fadeUp .28s ease forwards}
 
/* ── Overlay / Modal ── */
.overlay{position:fixed;inset:0;background:rgba(20,12,8,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(4px)}
.modal-box{background:var(--white);border-radius:var(--r-lg);width:100%;max-width:520px;padding:28px;animation:fadeUp .22s ease;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--dark2);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.modal-title-sub{font-size:11px;color:var(--muted);font-family:'Inter',sans-serif;margin-top:2px;font-weight:400}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px;border-radius:6px;transition:all .15s}
.modal-close:hover{background:var(--surface2);color:var(--dark2)}
 
/* ── Layout ── */
#app{display:flex;flex-direction:column;min-height:100vh}
header{background:var(--dark);padding:0 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;flex-shrink:0;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06)}
.logo-area{padding:15px 0}
.logo-name{font-family:'Playfair Display',serif;font-size:19px;color:var(--pri);letter-spacing:4px}
.logo-sub{font-size:8px;letter-spacing:3.5px;color:var(--sec);text-transform:uppercase;margin-top:3px}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav-btn{cursor:pointer;border:none;padding:9px 16px;font-size:11px;letter-spacing:.5px;background:transparent;color:#7A6A60;border-radius:var(--r-sm);transition:all .18s;font-family:'Inter',sans-serif;font-weight:600;text-transform:uppercase}
.nav-btn.active{background:var(--pri);color:#fff}
.nav-btn:hover:not(.active){color:#fff;background:rgba(196,133,106,.2)}
main{flex:1;padding:24px;max-width:1140px;margin:0 auto;width:100%}
 
/* ── Dashboard ── */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.kpi-card{padding:24px 22px;position:relative;overflow:hidden}
.kpi-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600}
.kpi-val{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;line-height:1}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:6px}
.kpi-accent{position:absolute;right:-8px;top:-8px;width:70px;height:70px;border-radius:50%;opacity:.08}
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;margin-top:6px;padding:2px 8px;border-radius:20px}
.kpi-delta.up{background:var(--green-bg);color:var(--green)}
.kpi-delta.down{background:var(--danger-bg);color:var(--danger)}
 
/* ── Dashboard 2-col ── */
.dash-two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
.dash-three{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:24px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--dark2);font-weight:500}
.section-eyebrow{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
 
/* ── Activity feed ── */
.activity-item{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border2)}
.activity-item:last-child{border-bottom:none}
.activity-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.activity-text{font-size:12px;color:var(--dark2);line-height:1.5}
.activity-time{font-size:10px;color:var(--muted);margin-top:2px}
 
/* ── Quick stats bar ── */
.stats-bar{background:var(--dark2);border-radius:var(--r);padding:18px 24px;display:flex;gap:0;margin-bottom:24px;overflow:hidden}
.stats-bar-item{flex:1;text-align:center;position:relative}
.stats-bar-item+.stats-bar-item::before{content:'';position:absolute;left:0;top:20%;height:60%;width:1px;background:rgba(255,255,255,.1)}
.stats-bar-val{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#fff}
.stats-bar-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#7A6A60;margin-top:4px}
.stats-bar-sub{font-size:10px;color:var(--muted);margin-top:3px}
 
/* ── Mini chart ── */
.mini-chart{display:flex;align-items:flex-end;gap:5px;height:60px;margin-top:12px}
.mini-bar{flex:1;border-radius:4px 4px 0 0;min-height:4px;transition:all .3s;cursor:pointer;position:relative}
.mini-bar:hover{opacity:.8}
.mini-bar-label{font-size:9px;color:var(--muted);text-align:center;margin-top:4px}
 
/* ── Packages page ── */
.pkg-builder-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pkg-card-v2{padding:22px;border-left:4px solid var(--pri);position:relative;transition:all .2s}
.pkg-card-v2:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.pkg-card-title{font-family:'Playfair Display',serif;font-size:17px;margin-bottom:4px}
.pkg-card-price{font-size:30px;font-weight:700;margin:8px 0 4px}
.pkg-card-meta{font-size:11px;color:var(--muted)}
.pkg-card-rate{font-size:11px;margin-top:6px;font-weight:600}
.pkg-card-actions{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border2)}
.pkg-promo-badge{position:absolute;top:14px;right:14px;background:var(--gold-light);color:#8B6020;border:1px solid #E8C87A;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.5px;padding:3px 9px;text-transform:uppercase}
 
/* ── Promo card ── */
.promo-card{padding:18px;border-left:4px solid var(--gold);background:var(--gold-light)}
.promo-type-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(212,169,106,.2);color:#8B6020;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;margin-bottom:8px}
 
/* ── Students ── */
.stu-card{padding:18px 20px;display:flex;align-items:center;gap:16px;transition:all .2s}
.stu-card:hover{transform:translateX(2px)}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex-shrink:0;background:linear-gradient(135deg,var(--pri),var(--sec))}
.stu-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
 
/* ── Calendar ── */
.cal-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.week-nav{display:flex;align-items:center;gap:8px}
.week-lbl{font-size:13px;color:var(--muted);min-width:220px;text-align:center;font-weight:500}
.cal-table{width:100%;border-collapse:separate;border-spacing:3px 3px;font-size:12px}
.cal-th{padding:10px 6px;text-align:center;font-weight:600;font-size:10px;color:var(--dark2);letter-spacing:.5px;text-transform:uppercase}
.cal-th.today{color:var(--pri)}
.time-cell{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;padding:3px 8px;vertical-align:middle}
.class-cell{border-radius:var(--r-sm);padding:6px 7px;cursor:pointer;transition:all .18s;min-height:54px;border:1px solid transparent;position:relative}
.class-cell:hover{transform:scale(1.025);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.class-cell.yoga{background:var(--yoga-bg);border-color:var(--yoga-bd)}
.class-cell.pole{background:var(--pole-bg);border-color:var(--pole-bd)}
.class-type{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.class-cell.yoga .class-type{color:var(--pri)}
.class-cell.pole .class-type{color:var(--sec-dark)}
.att-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.att-dot{width:16px;height:16px;border-radius:50%;background:var(--pri);color:#fff;font-size:7px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.att-dot.confirmed{background:var(--sec)}
.att-dot.appt{background:var(--acc);color:var(--dark2);border:1px solid var(--pri)}
.cupo-badge{position:absolute;top:4px;right:5px;font-size:7px;color:var(--muted);font-weight:700}
.empty-cell{background:#F5F0EB;border-radius:var(--r-sm);opacity:.25}
.break-row td{padding:6px 0;text-align:center;font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
 
/* ── Receipts ── */
.receipt-row{display:grid;grid-template-columns:110px 1fr 130px 80px 90px 130px 110px;gap:0;align-items:center;padding:12px 18px;border-top:1px solid var(--border2);font-size:12px}
.receipt-hdr{background:var(--surface2);padding:9px 18px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:grid;grid-template-columns:110px 1fr 130px 80px 90px 130px 110px;font-weight:600}
.folio-badge{display:inline-block;background:var(--pri-light);border-radius:6px;padding:3px 9px;font-size:10px;letter-spacing:1px;color:var(--pri);font-weight:700;font-family:'Inter',monospace}
 
/* ── Pkg rows inside modals ── */
.pkg-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);margin-bottom:8px;border:1.5px solid var(--border);background:var(--surface2);transition:all .18s}
.pkg-bar-wrap{background:var(--border);border-radius:10px;height:5px;margin-top:6px;overflow:hidden}
.pkg-bar{height:5px;border-radius:10px;background:var(--sec);transition:width .4s}
 
/* ── Appt rows ── */
.appt-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm);margin-bottom:7px;border:1.5px solid var(--border);background:var(--surface2);transition:all .18s}
.appt-row.confirmed{background:var(--sec-light);border-color:var(--sec)}
 
/* ── Payment options ── */
.pay-option{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r-sm);border:2px solid var(--border);cursor:pointer;transition:all .18s;margin-bottom:8px;background:var(--surface2)}
.pay-option:hover{border-color:var(--pri)}
.pay-option.selected{border-color:var(--pri);background:var(--pri-light)}
 
/* ── Empty states ── */
.empty-state{padding:52px;text-align:center}
.empty-icon{font-size:38px;margin-bottom:12px;opacity:.7}
.empty-txt{font-family:'Playfair Display',serif;font-size:18px;color:var(--muted)}
.empty-sub{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.6}
 
/* ── Danger zone ── */
.danger-zone{margin-top:18px;padding:14px;border-radius:var(--r-sm);background:var(--danger-bg);border:1px dashed var(--danger-bd)}
.danger-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--danger);margin-bottom:10px;font-weight:700}
 
/* ── Package selector in modals ── */
.pkg-option{width:100%;background:var(--surface2);border-radius:var(--r-sm);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .18s;margin-bottom:9px;border:2px solid var(--border)}
.pkg-option:hover{border-color:var(--pri);transform:translateY(-1px);box-shadow:0 4px 12px rgba(196,133,106,.15)}
.pkg-option.selected{border-color:var(--pri);background:var(--pri-light)}
.pkg-option-promo{font-size:9px;font-weight:700;background:var(--gold-light);color:#8B6020;border-radius:4px;padding:2px 7px;margin-top:3px;display:inline-block}
 
/* ── Discount display ── */
.discount-line{display:flex;align-items:center;gap:6px;background:var(--gold-light);border:1px solid #E8C87A;border-radius:var(--r-sm);padding:8px 12px;margin:10px 0}
.discount-line span{font-size:12px;color:#8B6020;font-weight:600}
 
/* ── Report ── */
.report-screen{position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;padding:28px}
.report-header{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.report-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--dark2)}
.report-section{margin-bottom:30px}
.report-section-title{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);font-weight:700}
.report-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.report-kpi{background:var(--white);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border2)}
.report-kpi-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.report-kpi-val{font-family:'Playfair Display',serif;font-size:30px;font-weight:700}
.report-table{width:100%;border-collapse:collapse;font-size:12px}
.report-table th{background:var(--surface2);padding:10px 14px;text-align:left;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.report-table td{padding:11px 14px;border-bottom:1px solid var(--border2);color:var(--dark2)}
.report-table tr:last-child td{border-bottom:none}
.report-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.report-bar-label{font-size:12px;width:110px;flex-shrink:0;color:var(--dark2)}
.report-bar-track{flex:1;background:var(--border);border-radius:6px;height:10px;overflow:hidden}
.report-bar-fill{height:10px;border-radius:6px;background:var(--pri);transition:width .6s}
.report-bar-val{font-size:12px;font-weight:700;width:80px;text-align:right;flex-shrink:0}
 
/* ── Status bar ── */
#status-bar{padding:5px 12px;font-size:10px;font-weight:700;border-radius:20px;transition:all .3s}
#status-bar.online{color:var(--sec)}
#status-bar.offline{color:var(--danger);animation:pulse 2s infinite}
#status-bar.saving{color:var(--muted)}
#install-btn{display:none;cursor:pointer;border:1.5px solid var(--pri);background:transparent;color:var(--pri);padding:7px 14px;border-radius:7px;font-size:10px;font-weight:700;font-family:'Inter',sans-serif}
#install-btn.show{display:block}
 
/* ── Loading ── */
.loading-screen{position:fixed;inset:0;background:#1E1510;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.spinner{width:36px;height:36px;border:3px solid rgba(196,133,106,.2);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}
.loading-lbl{font-family:'Playfair Display',serif;font-size:22px;color:var(--pri);letter-spacing:6px}
.loading-sub{font-size:11px;color:#7A6A60;margin-top:8px;letter-spacing:1px}
 
/* ── Page header ── */
h1.pg{font-family:'Playfair Display',serif;font-size:26px;color:var(--dark2);margin-bottom:22px;font-weight:500}
.pg-sub{font-size:13px;color:var(--muted);margin-top:4px}
 
/* ── Range input ── */
.range-wrap{display:flex;align-items:center;gap:10px;margin-top:6px}
input[type=range]{flex:1;accent-color:var(--pri)}
.range-val{font-size:14px;font-weight:700;color:var(--pri);min-width:50px;text-align:right}
 
/* ── Color picker row ── */
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.color-dot.sel{border-color:var(--dark2);transform:scale(1.15)}
 
/* ── Divider ── */
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
 
/* ── Tab pills inside modal ── */
.tab-pills{display:flex;gap:2px;background:var(--surface2);border-radius:var(--r-sm);padding:4px;margin-bottom:18px}
.tab-pill{flex:1;text-align:center;padding:8px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .18s;color:var(--muted);border:none;background:none;font-family:'Inter',sans-serif}
.tab-pill.active{background:var(--white);color:var(--pri);box-shadow:0 1px 6px rgba(0,0,0,.1)}
 
@media(max-width:780px){

// Calcula precio final con promo
function calcPromo(pkg,promo){
  if(!promo||!promo.active)return{price:pkg.price,extra:0,label:null};
  if(promo.type==='pct'){
    const disc=Math.round(pkg.price*(promo.value/100));
    return{price:pkg.price-disc,extra:0,label:`${promo.value}% desc.`,saved:disc};
  }
  if(promo.type==='fijo'){
    return{price:promo.value,extra:0,label:`Precio esp.`,saved:pkg.price-promo.value};
  }
  if(promo.type==='gratis'){
    return{price:pkg.price,extra:promo.value,label:`+${promo.value} clases gratis`};
  }
  if(promo.type==='2x1'){
    return{price:pkg.price,extra:pkg.classes,label:'2×1'};
  }
  return{price:pkg.price,extra:0,label:null};
}

function addPackage(sid,pkgDefId,payMethod){

  const key=`${dk}_${slotId}`;
  setState({appointments:{...S.appointments,[key]:(S.appointments[key]||[]).filter(a=>a.id!==apptId)}});
}
function toggleConfirmAppt(dk,slotId,apptId){
  const key=`${dk}_${slotId}`;
  const cur=S.appointments[key]||[];
  const updated=cur.map(a=>a.id!==apptId?a:{...a,confirmed:!a.confirmed});
  const appt=updated.find(a=>a.id===apptId);
  const attCur=S.attendance[key]||[];
  if(appt.confirmed){
    if(!attCur.includes(appt.studentId)){
      const stu=S.students.find(s=>s.id===appt.studentId);
      const pkg=stu?.packages.find(p=>p.remaining>0);
      if(!pkg){alert(`${appt.studentName} no tiene clases disponibles.\nAgrégale un paquete.`);return;}
      const ns=S.students.map(s=>s.id!==appt.studentId?s:{...s,packages:s.packages.map(p=>p.id!==pkg.id?p:{...p,remaining:p.remaining-1})});
      setState({appointments:{...S.appointments,[key]:updated},attendance:{...S.attendance,[key]:[...attCur,appt.studentId]},students:ns});return;
    }
  } else {
    if(attCur.includes(appt.studentId)){
      const stu=S.students.find(s=>s.id===appt.studentId);
      const pkgR=[...stu.packages].reverse().find(p=>p.remaining<p.total);
      let ns=S.students;
      if(pkgR)ns=S.students.map(s=>s.id!==appt.studentId?s:{...s,packages:s.packages.map(p=>p.id!==pkgR.id?p:{...p,remaining:Math.min(p.remaining+1,p.total)})});
      setState({appointments:{...S.appointments,[key]:updated},attendance:{...S.attendance,[key]:attCur.filter(id=>id!==appt.studentId)},students:ns});return;
    }
  }
  setState({appointments:{...S.appointments,[key]:updated}});
}

// ── DOM helpers ────────────────────────────────────────────────────
function el(tag,attrs={},ch=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')e.className=v;
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else e.setAttribute(k,v);
  }
  for(const c of ch)if(c!=null)typeof c==='string'?e.appendChild(document.createTextNode(c)):e.appendChild(c);
  return e;
}
const div=(cls,ch=[],a={})=>el('div',{class:cls,...a},ch);
function btn(label,onClick,cls='btn btn-ghost',extra={}){
  const b=el('button',{class:cls,onClick},[label]);
  Object.assign(b.style,extra);return b;
}

// ── PACKAGES ───────────────────────────────────────────────────────

function renderPackages(){
  const wrap=div('fade');
  const top=div('',[], {style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'24px',flexWrap:'wrap',gap:'12px'}});
  const ta=el('div');

  top.appendChild(ta);
  top.appendChild(btn('+ Nuevo paquete',()=>setState({modal:'newPkg'},false),'btn btn-pri'));
  wrap.appendChild(top);
 
  if(!S.packages.length){
    const es=div('card empty-state');
    es.appendChild(el('div',{class:'empty-icon'},['📦']));
    es.appendChild(el('div',{class:'empty-txt'},['Sin paquetes creados']));
    es.appendChild(el('div',{class:'empty-sub'},['Crea tu primer paquete arriba']));
    wrap.appendChild(es);return wrap;
  }
 
  const grid=div('pkg-builder-grid');
  S.packages.forEach(pkg=>{
    const promo=pkg.promo&&pkg.promo.active?pkg.promo:null;
    const calc=promo?calcPromo(pkg,promo):null;
    const card=div('card pkg-card-v2',[],{style:{borderLeftColor:pkg.color,opacity:pkg.active?'1':'.55'}});
    if(!pkg.active)card.style.filter='grayscale(0.4)';
 
    // Promo badge
    if(promo&&calc?.label)card.appendChild(el('div',{class:'pkg-promo-badge'},[`🎁 ${calc.label}`]));
 
    card.appendChild(el('div',{class:'pkg-card-title'},[pkg.name]));
    card.appendChild(el('div',{class:'pkg-card-meta'},[`${pkg.classes} clases`+(promo&&calc?.extra>0?` + ${calc.extra} gratis`:'')]));
 
    const priceWrap=el('div',{style:{display:'flex',alignItems:'baseline',gap:'8px',margin:'8px 0 4px'}});
    if(calc&&calc.price!==pkg.price){
      priceWrap.appendChild(el('div',{style:{textDecoration:'line-through',fontSize:'16px',color:'var(--muted)'}},[fmt$(pkg.price)]));
      priceWrap.appendChild(el('div',{class:'pkg-card-price',style:{color:pkg.color}},[fmt$(calc.price)]));
    } else {
      priceWrap.appendChild(el('div',{class:'pkg-card-price',style:{color:pkg.color}},[fmt$(pkg.price)]));
    }
    card.appendChild(priceWrap);
    if(pkg.classes>1)card.appendChild(el('div',{class:'pkg-card-rate',style:{color:pkg.color}},[ `${fmt$(Math.round((calc?.price||pkg.price)/pkg.classes))}/clase` ]));
 
    if(promo){
      const pb=div('promo-card',[],{style:{marginTop:'12px',borderRadius:'8px',padding:'10px 14px'}});
      pb.appendChild(el('div',{class:'promo-type-badge'},[`🎁 ${PROMO_TYPES.find(t=>t.id===promo.type)?.label||promo.type}`]));
      pb.appendChild(el('div',{style:{fontSize:'11px',color:'#8B6020'}},[PROMO_TYPES.find(t=>t.id===promo.type)?.desc||'']));
      if(promo.type==='pct')pb.appendChild(el('div',{style:{fontSize:'12px',fontWeight:'700',color:'#8B6020',marginTop:'4px'}},[`${promo.value}% — Ahorro: ${fmt$(Math.round(pkg.price*promo.value/100))}`]));
      if(promo.type==='fijo')pb.appendChild(el('div',{style:{fontSize:'12px',fontWeight:'700',color:'#8B6020',marginTop:'4px'}},[`Precio especial: ${fmt$(promo.value)}`]));
      if(promo.type==='gratis')pb.appendChild(el('div',{style:{fontSize:'12px',fontWeight:'700',color:'#8B6020',marginTop:'4px'}},[`+${promo.value} clases adicionales`]));
      if(promo.type==='2x1')pb.appendChild(el('div',{style:{fontSize:'12px',fontWeight:'700',color:'#8B6020',marginTop:'4px'}},['Paga 1, lleva 2 paquetes']));
      card.appendChild(pb);
    }
 
    const actions=div('pkg-card-actions');
    actions.appendChild(btn('✏️ Editar',()=>setState({modal:`editPkg:${pkg.id}`},false),'btn btn-ghost btn-sm'));
    actions.appendChild(btn(promo&&promo.active?'🗑 Quitar promo':'🎁 Agregar promo',()=>setState({modal:`promoPkg:${pkg.id}`},false),'btn btn-sm',{background:'var(--gold-light)',color:'#8B6020',border:'1px solid #E8C87A'}));
    actions.appendChild(btn(pkg.active?'Desactivar':'Activar',()=>togglePackageDef(pkg.id),'btn btn-ghost btn-sm',{marginLeft:'auto'}));
    card.appendChild(actions);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

// ── REPORT ─────────────────────────────────────════════════════════
// ═══════════════════════════════════════════════════════════════════
function renderReport(){
  const{type,date}=S.report;
  const now=new Date(date);
  let rangeStart,rangeEnd,rangeLabel;
  if(type==='week'){
    rangeStart=getMonday(now);rangeEnd=addDays(rangeStart,6);
    const ds=rangeStart.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
    const de=rangeEnd.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
    rangeLabel=`Semana del ${ds} al ${de}`;
  } else {
    rangeStart=new Date(now.getFullYear(),now.getMonth(),1);
    rangeEnd=new Date(now.getFullYear(),now.getMonth()+1,0);
    rangeLabel=monthName(now).charAt(0).toUpperCase()+monthName(now).slice(1);
  }
  const startKey=dKey(rangeStart),endKey=dKey(rangeEnd);
  const receipts=S.receipts.filter(r=>{const k=dKey(new Date(r.date));return k>=startKey&&k<=endKey;});
  const totalVentas=receipts.reduce((s,r)=>s+r.amount,0);
  const efectivo=receipts.filter(r=>!r.payMethod||r.payMethod==='efectivo').reduce((s,r)=>s+r.amount,0);
  const transferencia=receipts.filter(r=>r.payMethod==='transferencia').reduce((s,r)=>s+r.amount,0);
  const totalAhorros=receipts.reduce((s,r)=>s+(r.savedAmount||0),0);
  const attInRange=Object.entries(S.attendance).filter(([k])=>{const dk2=k.split('_')[0];return dk2>=startKey&&dk2<=endKey;});
  const totalAtt=attInRange.reduce((s,[,v])=>s+v.length,0);
  const stuAtt={};
  attInRange.forEach(([,ids])=>ids.forEach(id=>stuAtt[id]=(stuAtt[id]||0)+1));
  const topStu=Object.entries(stuAtt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,cnt])=>{const s=S.students.find(st=>st.id===id);return{name:s?.name||'—',count:cnt};});
 
  let chartData=[];
  if(type==='week'){
    for(let i=0;i<7;i++){const d=addDays(rangeStart,i);const k=dKey(d);chartData.push({label:d.toLocaleDateString('es-MX',{weekday:'short'}),val:receipts.filter(r=>dKey(new Date(r.date))===k).reduce((s,r)=>s+r.amount,0)});}
  } else {
    let cur=new Date(rangeStart),wk=1;

        opt.appendChild(el('div',{style:{flex:'1'}},[el('div',{style:{fontWeight:'600',fontSize:'14px'}},[pm.name]),el('div',{style:{fontSize:'11px',color:'var(--muted)',marginTop:'1px'}},[pm.sub])]));
        if(selectedPay===pm.id)opt.appendChild(el('div',{style:{color:'var(--pri)',fontSize:'20px',fontWeight:'700'}},['✓']));
        box.appendChild(opt);
      });
 
      const btnRow=el('div',{style:{display:'flex',gap:'10px',marginTop:'18px'}});
      btnRow.appendChild(btn('← Cambiar',()=>setState({modal:`addPkg:${sid}`},false),'btn btn-ghost',{flex:'1'}));
      btnRow.appendChild(btn('Confirmar y generar recibo',()=>{if(!selectedPay){alert('Selecciona método de pago.');return;}addPackage(sid,selectedPkg,selectedPay);},'btn btn-pri',{flex:'2',opacity:selectedPay?'1':'.6'}));
      box.appendChild(btnRow);
    }
    ov.appendChild(box);
  }
 
  // ── Slot modal ──
  else if(S.modal?.startsWith('slot:')){
    const[,day,dk2,slotId]=S.modal.split(':');
    const slot=SLOTS.find(s=>s.id===slotId),ct=CM[day]?.[slotId];
    const ak=`${dk2}_${slotId}`;
    const appts=S.appointments[ak]||[];
    const dl=new Date(dk2+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    const cupoLeft=MAX_CUPO-appts.length;
    const box=div('modal-box');
    box.appendChild(div('modal-title',[el('div',[],[el('span',[],[ct==='yoga'?'Yoga':'Pole Fitness']),el('div',{class:'modal-title-sub'},[`${slot?.time} · ${dl}`])]),mkX()]));
    box.appendChild(el('div',{style:{fontSize:'11px',fontWeight:'700',color:cupoLeft<=0?'var(--danger)':'var(--muted)',marginBottom:'14px',padding:'6px 10px',background:'var(--surface2)',borderRadius:'6px',display:'inline-block'}},[`Cupo: ${appts.length}/${MAX_CUPO} · ${cupoLeft>0?`${cupoLeft} lugares disponibles`:'Clase llena'}`]));
    box.appendChild(el('div',{class:'inp-label',style:{marginBottom:'8px'}},['Citas agendadas']));
    if(!appts.length){
      box.appendChild(el('div',{style:{fontSize:'13px',color:'var(--muted)',marginBottom:'12px',padding:'14px',background:'var(--surface2)',borderRadius:'8px',textAlign:'center'}},['Sin citas para esta clase']));
    } else {
      appts.forEach(a=>{
        const row=div(`appt-row${a.confirmed?' confirmed':''}`);
        const av=el('div',{style:{width:'32px',height:'32px',borderRadius:'50%',background:a.confirmed?'var(--sec)':'var(--acc)',display:'flex',alignItems:'center',justifyContent:'center',color:a.confirmed?'#fff':'var(--dark2)',fontWeight:'700',fontSize:'13px',flexShrink:'0'}});
        av.textContent=a.confirmed?'✓':a.studentName.charAt(0).toUpperCase();
        const info=el('div',{style:{flex:'1'}});
        info.appendChild(el('div',{style:{fontWeight:'600',fontSize:'13px'}},[a.studentName]));
        info.appendChild(el('div',{style:{fontSize:'10px',color:'var(--muted)',marginTop:'1px'}},[a.confirmed?'✓ Asistencia confirmada':'Pendiente de confirmar']));
        row.appendChild(av);row.appendChild(info);
        row.appendChild(btn(a.confirmed?'✓':'Confirmar',()=>toggleConfirmAppt(dk2,slotId,a.id),'btn btn-sm',{background:a.confirmed?'var(--sec)':'var(--yoga-bg)',color:a.confirmed?'#fff':'var(--pri)',border:a.confirmed?'none':'1px solid var(--yoga-bd)',marginRight:'4px'}));
        row.appendChild(btn('✕',()=>removeAppointment(dk2,slotId,a.id),'btn btn-danger btn-sm'));
        box.appendChild(row);
      });
    }
    if(cupoLeft>0&&S.students.length){
      box.appendChild(el('div',{class:'inp-label',style:{margin:'14px 0 8px'}},['Agendar estudiante']));
      const alreadyIn=appts.map(a=>a.studentId);
      const available=S.students.filter(s=>!alreadyIn.includes(s.id));
      if(!available.length){
        box.appendChild(el('div',{style:{fontSize:'13px',color:'var(--muted)'}},['Todas las estudiantes ya están agendadas']));
      } else {
        const sel=el('select',{class:'inp',style:{marginBottom:'8px'}});
        sel.appendChild(el('option',{value:''},[`— Selecciona (${available.length} disponibles) —`]));
        available.forEach(s=>{
          const rem=s.packages.reduce((a,p)=>a+p.remaining,0);
          sel.appendChild(el('option',{value:s.id},[`${s.name} (${rem} clases disponibles)`]));
        });
        box.appendChild(sel);
        box.appendChild(btn('+ Agendar',()=>{if(!sel.value){alert('Selecciona una estudiante.');return;}addAppointment(dk2,slotId,sel.value);},'btn btn-pri',{width:'100%',justifyContent:'center',marginTop:'4px'}));
      }
    }
    ov.appendChild(box);
  }
 
  return ov;
}
 
function mkX(){
  const b=el('button',{class:'modal-close',onClick:()=>setState({modal:null},false)},['✕']);
  return b;
}
 
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
